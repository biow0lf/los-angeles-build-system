# Minimal apko config listing ONLY the self-hosted packages that share a
# name with a Wolfi package and need to be force-resolved to our own
# @local build rather than Wolfi's. Not built or booted on its own --
# consumed exclusively by generate-lockfile.sh, which locks this config
# to get correct, checksum-verified entries for these names, then splices
# them over the same-named entries in los-angeles-linux.yaml's own lock.
#
# Two distinct problems land here, both solved the same way:
#
# - glibc-2.44 and glibc-2.44-iconv: pinning @local directly in
#   los-angeles-linux.yaml breaks the solver outright (see that file's
#   comment) -- apk-tools' so:libc.so.6 need is a *separate* edge from the
#   direct "glibc-2.44" want, and once the direct want is pinned, the
#   solver disqualifies every other glibc revision for that edge and
#   fails, instead of reusing the pinned package.
#
# - libblkid, libfdisk, libmount, libsmartcols, libuuid, fstrim
#   (util-linux's own subpackages), libcom_err, e2fsprogs-libs
#   (e2fsprogs's), and libsystemd, libsystemd-shared,
#   libsystemd-compression-libs, systemd-boot, systemd-systemctl
#   (systemd's): pulled in transitively (the parent's own runtime deps,
#   or another package's dependency on one of these shared libs) rather
#   than wanted directly -- util-linux@local/e2fsprogs@local/systemd@local
#   themselves resolve fine, but that pin has no effect on these separate,
#   same-version, same-epoch named wants, so they resolve to whichever
#   repo the solver happens to pick (observed: Wolfi's, every time,
#   verified via `apko lock` on the parent package @local in isolation).
#
# Locking THIS minimal config (rather than pinning @local directly in
# los-angeles-linux.yaml for names that show either problem) sidesteps
# both: nothing else in this tiny want-list creates a competing edge, so
# @local resolves cleanly here.
#
# Add a package's @local name here once it's self-hosted and either (a)
# pinning it directly breaks the solver, or (b) it's a subpackage that
# could get pulled in transitively under its own name -- then re-run
# generate-lockfile.sh (invoked automatically by `make build-rootfs`).
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local packages-out"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - keys/melange.rsa.pub
  packages:
    - glibc-2.44@local
    - glibc-2.44-iconv@local
    - libblkid@local
    - libfdisk@local
    - libmount@local
    - libsmartcols@local
    - libuuid@local
    - fstrim@local
    - libcom_err@local
    - e2fsprogs-libs@local
    - libsystemd@local
    - libsystemd-shared@local
    - libsystemd-compression-libs@local
    - systemd-boot@local
    - systemd-systemctl@local

archs:
  - x86_64
