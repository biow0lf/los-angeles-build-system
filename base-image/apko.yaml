contents:
  keyring:
    - ../keys/melange.rsa.pub

  repositories:
    - https://pub-3a8f2e6595544a6a883e17caa4383bdd.r2.dev

  packages:
    - unfriendly-keys
    - wolfi-baselayout
    - wolfi-base
    - apk-tools
    - bash
    - bash-binsh
    - coreutils
    - linux-firmware
    - apko
    - melange

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 0        # wolfi-base runs as root; use 65532 for nonroot

entrypoint:
  command: /bin/sh -l

archs:
  - x86_64
