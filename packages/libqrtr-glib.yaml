package:
  name: libqrtr-glib
  version: 1.4.0
  epoch: 0
  description: "Support library to use and manage the QRTR (Qualcomm IPC Router) bus"
  url: https://gitlab.freedesktop.org/mobile-broadband/libqrtr-glib
  copyright:
    - license: "LGPL-2.1-or-later"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - gobject-introspection-dev
      - glib-gir

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/mobile-broadband/libqrtr-glib
      tag: ${{package.version}}
      expected-commit: 69791f8f2a092d0ec8eb83cbe51dfc3d157c3079

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: "libqrtr-glib-dev"
    description: "libqrtr-glib dev"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libqrtr-glib=${{package.full-version}}
