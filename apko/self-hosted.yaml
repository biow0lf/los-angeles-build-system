# Minimal apko config listing ONLY the self-hosted packages that share a
# name with a Wolfi package and need to be force-resolved to our own
# @local build rather than Wolfi's. Not built or booted on its own --
# consumed exclusively by generate-lockfile.sh, which locks this config
# to get correct, checksum-verified entries for these names, then splices
# them over the same-named entries in los-angeles-linux.yaml's own lock.
#
# Three distinct problems land here, all solved the same way:
#
# - glibc-2.44 and glibc-2.44-iconv: pinning @local directly in
#   los-angeles-linux.yaml breaks the solver outright (see that file's
#   comment) -- apk-tools' so:libc.so.6 need is a *separate* edge from the
#   direct "glibc-2.44" want, and once the direct want is pinned, the
#   solver disqualifies every other glibc revision for that edge and
#   fails, instead of reusing the pinned package.
#
# - wolfi-baselayout: same direct-want-vs-transitive-edge shape as
#   glibc-2.44, but via plain name deps instead of a soname, and it fails
#   *silently* instead of erroring -- almost every other package's own
#   runtime deps reference wolfi-baselayout directly (it provides
#   merged-bin/merged-sbin/merged-usrsbin/merged-lib/merged-varrun), so
#   pinning it directly in los-angeles-linux.yaml quietly resolves to
#   Wolfi's copy instead, even with our epoch bumped past Wolfi's (their
#   own live epoch happened to be an exact tie when this was
#   self-hosted -- the bump was still needed: without it, even resolving
#   *this* file in isolation picks Wolfi's copy).
#
# - libblkid, libfdisk, libmount, libsmartcols, libuuid, fstrim
#   (util-linux's own subpackages), libcom_err, e2fsprogs-libs
#   (e2fsprogs's), libsystemd, libsystemd-shared, systemd-boot,
#   systemd-systemctl (systemd's), dbus-libs (dbus's), openssh-client,
#   openssh-server, openssh-sftp-server, openssh-keygen,
#   openssh-server-config (openssh's), and ca-certificates-bundle
#   (ca-certificates's): pulled in transitively (the parent's own
#   runtime deps, or another package's dependency on one of these shared
#   libs/binaries) rather than wanted directly -- the parent package
#   @local itself resolves fine, but that pin has no effect on these
#   separate, same-version, same-epoch named wants, so they resolve to
#   whichever repo the solver happens to pick (observed: Wolfi's, every
#   time, verified via `apko lock` on the parent package @local in
#   isolation).
#
# libsystemd-compression-libs (also a systemd subpackage, same shape as
# the above) is a deliberate EXCEPTION, left unpinned: once both
# libsystemd@local and dbus-libs@local are present in this same want-list
# (dbus-libs needs so:libsystemd.so.0, i.e. libsystemd, which itself
# needs libsystemd-compression-libs), pinning it too makes the solver
# hit "selecting package libsystemd-compression-libs-*.apk conflicts
# with libsystemd-compression-libs-*.apk on libsystemd-compression-libs"
# -- an apparent go-apk limitation when the same name is reachable via
# both a direct want and a transitive edge from another already-pinned
# package. Not worth chasing: libsystemd-compression-libs is a pure
# metapackage (see systemd.yaml -- no files, just runtime deps on lz4,
# xz, zstd, none of which we self-host), so which repo's copy of it
# resolves is functionally meaningless either way.
#
# Locking THIS minimal config (rather than pinning @local directly in
# los-angeles-linux.yaml for names that show either problem) sidesteps
# both: nothing else in this tiny want-list creates a competing edge, so
# @local resolves cleanly here.
#
# Add a package's @local name here once it's self-hosted and either (a)
# pinning it directly breaks the solver, or (b) it's a subpackage that
# could get pulled in transitively under its own name -- then re-run
# generate-lockfile.sh (invoked automatically by `make build-rootfs`).
contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local packages-out"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - keys/melange.rsa.pub
  packages:
    - glibc-2.44@local
    - glibc-2.44-iconv@local
    - libblkid@local
    - libfdisk@local
    - libmount@local
    - libsmartcols@local
    - libuuid@local
    - fstrim@local
    - libcom_err@local
    - e2fsprogs-libs@local
    - libsystemd@local
    - libsystemd-shared@local
    - systemd-boot@local
    - systemd-systemctl@local
    - dbus-libs@local
    - openssh-client@local
    - openssh-server@local
    - openssh-sftp-server@local
    - openssh-keygen@local
    - openssh-server-config@local
    - ca-certificates-bundle@local
    - wolfi-baselayout@local

archs:
  - x86_64
