# TODO: add docs and bash/zsh/fish completions

package:
  name: dysk
  version: 3.8.2
  epoch: 1
  description: "A linux utility to get information on filesystems"
  url: https://dystroy.org/dysk/
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Canop/dysk
      tag: v${{package.version}}
      expected-commit: 990df3edc2a1312d2f943064f605025a45691c55

  - uses: cargo/build
    with:
      output: dysk

  - uses: strip
