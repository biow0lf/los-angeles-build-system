package:
  name: xfconf
  version: 4.20.0
  epoch: 0
  description: "Xfconf is a hierarchical (tree-like) configuration system"
  url: https://www.xfce.org
  copyright:
    - license: LGPL-2.0-only

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - glib-dev
      - libxfce4util-dev
      - gtk-doc
      - gobject-introspection-dev
      - vala
      - glib-gir

pipeline:
  - uses: fetch
    with:
      uri: https://archive.xfce.org/xfce/4.20/src/xfconf-4.20.0.tar.bz2
      expected-sha256: 8bc43c60f1716b13cf35fc899e2a36ea9c6cdc3478a8f051220eef0f53567efd

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: xfconf-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - xfconf=${{package.full-version}}
    description: xfconf dev
