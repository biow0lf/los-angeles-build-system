contents:
  keyring:
    - ../keys/melange.rsa.pub

  repositories:
    - https://pub-3a8f2e6595544a6a883e17caa4383bdd.r2.dev

  packages:
    - unfriendly-keys
    - wolfi-baselayout
    - wolfi-base
    - apk-tools
    - bash
    - bash-binsh
    - coreutils
    - gnutar
    - gawk
    - grep
    - gzip
    - less
    - man-db
    - man-pages
    - sed
    - procps-ng
    - htop
    - btop
    - bc
    - tree
    - bzip2
    - xz
    - zstd
    - e2fsprogs
    - e2fsprogs-extra
    - btrfs-progs
    - xfsprogs
    - xfsprogs-core
    - xfs-scrub
    - xfsprogs-extra
    - linux-firmware
    - apko
    - melange

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 0        # wolfi-base runs as root; use 65532 for nonroot

entrypoint:
  command: /bin/sh -l

archs:
  - x86_64
