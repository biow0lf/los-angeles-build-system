package:
  name: stb
  version: 20261020
  epoch: 0
  description: "stb single-file public domain libraries for C/C++"
  url: https://github.com/nothings/stb
  copyright:
    - license: MIT or Public Domain

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nothings/stb
      depth: -1
      expected-commit: a7d4c2175630e1ea5b6f8dd00ab96fed0b97b96d

  - runs: |
      install -D -m 644 stb_image_write.h ${{targets.destdir}}/usr/include/stb/stb_image_write.h
