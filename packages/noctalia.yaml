# SPDX-License-Identifier: MIT

package:
  name: noctalia
  version: 5.3.0
  epoch: 0
  description: "A sleek, customizable desktop shell crafted for Wayland"
  url: https://noctalia.dev/
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson
      - sdbus-cpp-dev
      - wayland-dev
      - wayland-protocols-dev
      - freetype-dev
      - fontconfig-dev
      - cairo-dev
      - pango-dev
      - librsvg-dev
      - libxkbcommon-dev
      - libsecret-dev
      - libsodium-dev
      - polkit-dev
      - pipewire-dev
      - wireplumber-dev
      - curl-dev
      - libqalculate-dev
      - md4c-dev
      - nlohmann-json-dev
      - tomlplusplus
      - libical-dev
      - linux-pam-dev
      - libepoxy-dev
      - jemalloc-dev
      - stb_image_resize
      - stb
      - libjxl-dev
      - libsndfile-dev
      - gmp-dev
      - openssl-4.0-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/noctalia-dev/noctalia
      tag: v${{package.version}}
      expected-commit: a33122c4208a385e19c9a252e65e2751b2c44fbb

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
