package:
  name: alsa-firmware
  version: 1.2.4
  epoch: 0
  description: "ALSA Firmware"
  url: https://www.alsa-project.org/wiki/Main_Page
  copyright:
    - license: Distributable

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://www.alsa-project.org/files/pub/firmware/alsa-firmware-1.2.4.tar.bz2
      expected-sha256: b67b6d7d08bcfc247ef6ff0ab88a99c188305a3cf57ae2dfd0bcd9a5b36cd5bb

  - uses: autoconf/configure
    with:
      opts: |
        --with-hotplug-dir=/usr/lib/firmware

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip
