package:
  name: hyprlauncher
  version: 0.1.7
  epoch: 1 # so:libicuuc.so.78
  description: "A multipurpose and versatile launcher / picker for Hyprland"
  url: https://github.com/hyprwm/hyprlauncher
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - hyprtoolkit-dev
      - hyprutils-dev
      - pixman-dev
      - libdrm-dev
      - hyprwire-dev
      - libqalculate-dev
      - gmp-dev
      - mpfr-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprlauncher
      tag: v${{package.version}}
      expected-commit: d08efd580c782fbf52ec299f77cd6c0fef7ee3d5

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip
