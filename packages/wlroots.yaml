package:
  name: wlroots
  version: 0.20.2
  epoch: 6
  description: "A modular Wayland compositor library"
  url: https://gitlab.freedesktop.org/wlroots/wlroots/
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - wayland-dev
      - wayland-protocols-dev>=1.49
      - libdrm-dev
      - libxkbcommon-dev
      - pixman-dev
      - libudev-dev
      - hwdata-dev
      - hwdata-usb
      - hwdata-pci
      - hwdata-pnp
      - hwdata-net
      - cairo-dev
      - libinput-dev
      - xcb-util-renderutil-dev
      - mesa-dev
      - mesa-gbm
      - glslang-dev
      - seatd-dev
      - lcms2-dev
      - vulkan-loader-dev
      - xwayland-dev
      - xcb-util-wm-dev
      - libliftoff-dev
      - libdisplay-info-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/wlroots/wlroots.git
      tag: ${{package.version}}
      expected-commit: d783533489e1f75d6886c2ab5c5960090ef268f8

  # TODO: Run-time dependency xcb-errors found: NO  (tried pkg-config and cmake)
  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: wlroots-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - wlroots=${{package.full-version}}
    description: wlroots dev
