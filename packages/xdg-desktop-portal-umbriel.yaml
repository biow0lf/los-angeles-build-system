package:
  name: xdg-desktop-portal-umbriel
  version: 0.1.0
  epoch: 0
  description: "XDG Desktop Portal for Umbriel"
  url: https://github.com/noctalia-dev/xdg-desktop-portal-umbriel
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - sdbus-cpp-dev
      - pipewire-dev
      - wayland-dev
      - wayland-protocols-dev
      - libdrm-dev
      - mesa-dev
      - mesa-gbm
      - cairo-dev
      - tomlplusplus
      - nlohmann-json-dev
      - libei-dev
      - gtk-4-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/noctalia-dev/xdg-desktop-portal-umbriel
      depth: -1
      expected-commit: 79f087598d596ae8a81dff1036d0ab3b5c446584

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
