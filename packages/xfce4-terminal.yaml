package:
  name: xfce4-terminal
  version: 1.2.0
  epoch: 0
  description: "lightweight and easy to use terminal emulator application"
  url: https://www.xfce.org
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glib-dev
      - gtk-3-dev
      - vte-dev
      - libxfce4ui-dev
      - libxfce4util-dev
      - xfconf-dev
      - gtk-layer-shell-dev

pipeline:
  - uses: fetch
    with:
      uri: https://archive.xfce.org/src/apps/xfce4-terminal/1.2/xfce4-terminal-1.2.0.tar.xz
      expected-sha256: 6874c7b975cc3dc3bd636d57ffec723de7458202defe65377593d3a7e0734b94

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
