package:
  name: umbriel
  version: 0.1.0
  epoch: 1
  description: "A Wayland compositor built on wlroots"
  url: https://noctalia.dev/
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson
      - jemalloc-dev
      - wayland-dev
      - wayland-protocols-dev
      - wlroots-dev
      - tomlplusplus
      - nlohmann-json-dev
      - cairo-dev
      - pango-dev
      - bash

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/noctalia-dev/umbriel
      depth: -1
      expected-commit: 7097aeeb80e7b50d22c995b3905ce722e4fdbfaf

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
