package:
  name: linux-zen
  version: 7.2.14
  epoch: 0
  description: Linux ZEN
  url: https://github.com/zen-kernel/zen-kernel
  copyright:
    - license: "GPL-2.0-only"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - patch
      - zstd
      - flex
      - bison
      - rust-1.99
      - openssl-4.0
      - openssl-4.0-dev
      - elfutils-dev
      - diffutils
      - findutils
      - bash
      - bash-binsh
      - gnutar
      - perl
      - grep
      - xz
      - make
      - coreutils
      - gawk
      - cpio
      - sed
      - bc
      - posix-libc-utils
      - kmod

pipeline:
  - uses: fetch
    with:
      uri: https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.14.tar.xz
      expected-sha256: bb1b871ef95a8de10b3f7b7baf0e0d754abbf620f804b6caf860f226aa97647d
      extract: false

  - uses: fetch
    with:
      uri: https://github.com/zen-kernel/zen-kernel/releases/download/v7.2.14-zen1/linux-v7.2.14-zen1.patch.zst
      expected-sha256: a94435f2286711c14e2bdf14e9d95f7c4824b7eddb7d31a8250578d1943c1a6e
      extract: false

  - runs: |
      set -x

      make --version
      ls --version
      gawk --version
      cpio --version
      wget --version
      sed --version
      bc --version
      ldd --version
      zstdcat --version
      patch --version
      sh --version
      bash --version
      tar --version
      find --version
      diff --version
      flex --version
      bison --version
      perl --version
      grep --version
      openssl --version
      kmod --version

      tar xf linux-7.2.14.tar.xz

      pwd

      pushd linux-7.2.14
        zstdcat ../linux-v7.2.14-zen1.patch.zst | patch -p1

        echo "Setting config..."

        cp ../config.x86_64 .config

        make olddefconfig V=1

        diff -u .config.old .config || true

        make -s kernelrelease > version

        echo "Prepared linux-zen version $(<version)"

        # make all V=1

        make all -j$(nproc)

        # make install V=1 DESTDIR=${{targets.destdir}}

        mkdir -p "${{targets.destdir}}/usr/lib/modules"
        mkdir -p "${{targets.destdir}}/boot"

        ln -s usr/lib/ ${{targets.destdir}}/lib

        make modules_install INSTALL_MOD_PATH="${{targets.destdir}}" INSTALL_MOD_STRIP=1

        cp arch/x86/boot/bzImage "${{targets.destdir}}/boot/vmlinuz-7.2.14-zen1"
        cp System.map "${{targets.destdir}}/boot/System.map-7.2.14-zen1"
        cp .config "${{targets.destdir}}/boot/config-7.2.14-zen1"

        rm -f "${{targets.destdir}}/lib/modules/7.2.14-zen1/build"

        rm -f "${{targets.destdir}}/lib"
      popd
