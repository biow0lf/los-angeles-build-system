package:
  name: alsa-ucm-conf
  version: 1.2.16.1
  epoch: 0
  description: "ALSA Use Case Manager configuration"
  url: https://www.alsa-project.org/wiki/Main_Page
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://www.alsa-project.org/files/pub/lib/alsa-ucm-conf-1.2.16.1.tar.bz2
      expected-sha256: cf3d1c07e089a83c4ece2c20f05dd6a8aab7fcd108768c38811386880575492b
      extract: false

  - name: Install
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/alsa/"

      tar -C ${{targets.destdir}}/usr/share/alsa --strip-components=1 -xf ${{package.name}}-${{package.version}}.tar.bz2
