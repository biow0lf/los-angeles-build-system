package:
  name: man-pages
  version: 6.20
  epoch: 0
  description: "Linux kernel and C library user-space interface documentation"
  url: http://www.kernel.org/doc/man-pages/
  copyright:
    - license: "BSD-2-Clause AND BSD-3-Clause AND BSD-4.3TAHOE AND BSD-4-Clause-UC AND GPL-1.0-or-later AND GPL-2.0-only AND GPL-2.0-or-later AND LicenseRef-Fedora-Public-Domain AND LicenseRef-Fedora-UltraPermissive AND Linux-man-pages-1-para AND Linux-man-pages-copyleft AND Linux-man-pages-copyleft-2-para AND Linux-man-pages-copyleft-var AND MIT AND Spencer-94"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - bash
      - coreutils

pipeline:
  - uses: fetch
    with:
      uri: https://mirrors.edge.kernel.org/pub/linux/docs/man-pages/man-pages-${{package.version}}.tar.gz
      expected-sha256: 46f325713f2fd75c8d1f4fa42748153526a44846806d37028fab85cd0143de46

  - runs: |
      make -R install prefix=/usr DESTDIR=${{targets.destdir}}
