package:
  name: hyprlock
  version: 0.9.7
  epoch: 0
  description: "Hyprland's GPU-accelerated screen locking utility"
  url: https://github.com/hyprwm/hyprlock
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - mesa-dev
      - mesa-gbm
      - hyprwayland-scanner
      - wayland-dev
      - wayland-protocols-dev
      - hyprlang-dev
      - cairo-dev
      - hyprutils-dev
      - hyprgraphics-dev
      - sdbus-cpp-dev
      - libxkbcommon-dev
      - linux-pam-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprlock
      tag: v${{package.version}}
      expected-commit: 74efcdc96ee6d08480815064dab5112e0101eb1a

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip
