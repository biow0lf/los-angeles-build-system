package:
  name: hyprpwcenter
  version: 0.1.2
  epoch: 0
  description: "A GUI Pipewire control center"
  url: https://github.com/hyprwm/hyprpwcenter
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - hyprtoolkit-dev
      - hyprutils-dev
      - libdrm-dev
      - pipewire-dev
      - pixman-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprpwcenter
      tag: v${{package.version}}
      expected-commit: 2ce8f3d174f2ae1c50c7dcc182d809a5ab33cad2

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip
