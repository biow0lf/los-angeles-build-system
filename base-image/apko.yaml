contents:
  keyring:
    - ../keys/melange.rsa.pub

  repositories:
    - https://pub-3a8f2e6595544a6a883e17caa4383bdd.r2.dev

  packages:
    - unfriendly-keys
    - wolfi-baselayout
    - wolfi-base
    - attr
    - acl
    - apk-tools
    - bash
    - bash-binsh
    - coreutils
    - posix-libc-utils
    - gnutar
    - gawk
    - grep
    - gzip
    - less
    - man-db
    - man-pages
    - sed
    - procps-ng
    - htop
    - btop
    - bc
    - lsof
    - util-linux
    # - util-linux-bins
    - util-linux-misc
    - iproute2
    - ed
    - findutils
    - file
    - sudo
    - kbd
    - kmod
    - psmisc
    - cpio
    - systemd-init
    - systemd
    - dbus
    - shadow
    - tree
    - diffutils
    - unzip
    - texinfo
    - bzip2
    - xz
    - zstd
    - e2fsprogs
    - e2fsprogs-extra
    - btrfs-progs
    - xfsprogs
    - xfsprogs-core
    - xfs-scrub
    - xfsprogs-extra
    - dosfstools
    - linux-firmware
    - efivar
    - efibootmgr
    - vim
    - nano
    - midnight-commander
    - apko
    - melange

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 0        # wolfi-base runs as root; use 65532 for nonroot

entrypoint:
  command: /bin/sh -l

#entrypoint:
#  command: /bin/init

archs:
  - x86_64
