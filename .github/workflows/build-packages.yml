name: Build packages

# Rebuilds every package on every change under packages/ or pipelines/,
# rather than diffing for just the changed ones: melange has no
# build-time dependency graph across packages (see the plan's Risks
# section), so a diff-based trigger would miss stale build-time consumers
# of a changed package (e.g. a glibc bump). Rebuilding everything is
# simpler and strictly more correct.
#
# Each package gets its own matrix job (rather than one job looping over
# all of them) so a slow, heavy package -- glibc's full upstream testsuite
# in particular -- doesn't make every unrelated package push wait on it;
# total wall-clock is the slowest single package, not the sum of all of
# them.
#
# apko/**, Makefile, docker/builder/**, image/** and test/** are also in
# the trigger: those can't change what a package *contains*, but they can
# break whether the packages this workflow just built actually assemble
# into a bootable image (see the boot-test job below) -- a change to
# apko/generate-lockfile.sh, say, gets no CI signal at all otherwise.
#
# boot-test (below) downloads this workflow's own packages-out artifact
# rather than rebuilding from source a second time. A separate workflow
# that reran `make build-package` for every package on the same trigger
# paths (this repo's actual first cut at this) double-builds everything
# on any push that touches both a package and the image pipeline in the
# same commit -- twice the compute and wall-clock for zero extra
# coverage, since the boot test only cares that the packages built here
# assemble and boot, not that they can be rebuilt a second time.
on:
  push:
    branches: [main]
    paths: ["packages/**", "pipelines/**", "apko/**", "Makefile", "docker/builder/**", "image/**", "test/**"]
  pull_request:
    paths: ["packages/**", "pipelines/**", "apko/**", "Makefile", "docker/builder/**", "image/**", "test/**"]
  workflow_dispatch: {}

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          pkgs=$(for f in packages/*.yaml; do basename "$f" .yaml; done | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Write signing key
        run: |
          mkdir -p keys
          echo "${{ secrets.MELANGE_SIGNING_KEY_B64 }}" | base64 -d > keys/melange.rsa

      - name: Build ${{ matrix.package }}
        run: make build-package PKG=${{ matrix.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.package }}
          path: packages-out/x86_64/*.apk
          retention-days: 14

  # Merges every matrix leg's .apk files and regenerates one signed
  # APKINDEX over all of them (each leg's own mini-index, produced as a
  # side effect of `make build-package`, is discarded -- irrelevant once
  # merged).
  index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write signing key
        run: |
          mkdir -p keys
          echo "${{ secrets.MELANGE_SIGNING_KEY_B64 }}" | base64 -d > keys/melange.rsa

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          pattern: apks-*
          path: packages-out/x86_64
          merge-multiple: true

      - name: Rebuild signed index
        run: make build-index

      - uses: actions/upload-artifact@v4
        with:
          name: packages-out
          path: packages-out/
          retention-days: 14

  # Assembles the disk image from the packages just built above (no
  # rebuild -- downloads this run's own packages-out artifact) and
  # boot-tests it in QEMU. Doesn't need the melange signing key: apko
  # only verifies against the already-committed public key
  # (keys/melange.rsa.pub), it doesn't sign anything itself.
  boot-test:
    needs: index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-out
          path: packages-out/

      - name: Build disk image
        run: make build-image

      - name: Boot smoke test (QEMU)
        run: make test-boot

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: work/boot.log
          retention-days: 14

  # Publishes the repo to our own Cloudflare R2 bucket (public-read via its
  # r2.dev dev subdomain) so `apk add`/`apk upgrade` on a booted Los
  # Angeles Linux system (the mutable runtime model) has something real to
  # point at -- only from main, never from a PR, and only once the packages
  # built above are confirmed to actually produce a bootable image (needs:
  # boot-test, not just index) -- a package that indexes fine but breaks
  # the final image should never reach the public repo. `--delete` mirrors
  # this workflow's own rebuild-everything philosophy (see the top of this
  # file): the bucket always reflects exactly this run's packages-out,
  # never a stale leftover from a package since removed from packages/.
  #
  # R2 has no per-object ACLs (unlike Linode/AWS S3) -- public access is a
  # bucket-level setting already in place, so no --acl flag here. Region is
  # the literal string "auto", not a real AWS region -- R2's own S3 API
  # convention.
  #
  # Makefile's PUBLISHED_REPO and apko/los-angeles-linux.yaml's
  # runtime_repositories still point at GitHub Pages, not this bucket, for
  # now: R2 only had an empty seed object before this job ever ran, and
  # melange eagerly fetches every --repository-append'd index up front
  # regardless of need, so pointing build-time resolution at an empty/
  # invalid index breaks every single package build. This run is what
  # seeds R2 with real content for the first time; a follow-up commit
  # flips the read side over once this publish succeeds.
  publish:
    needs: boot-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-out
          path: packages-out/
      - name: Publish to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync packages-out/ s3://los-angeles-linux/ \
            --endpoint-url https://3cbfa894108429db9520d0e70906bcf0.r2.cloudflarestorage.com \
            --delete
