package:
  name: gstreamer
  version: 1.28.8
  epoch: 0
  description: "Media framework"
  copyright:
    - license: LGPL-2.1

environment:
  contents:
    packages:
      - build-base
      - busybox
      - bash-completion
      - python-3.13
      - flex
      - bison
      - glib-dev
      - gobject-introspection-dev
      - glib-gir

pipeline:
  - uses: fetch
    with:
      uri: https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-1.28.8.tar.xz
      expected-sha256: baa8e86985ad6417cc0ad6e7b79ff2884c6779c8b1c7a6240e7121822c86e524

  - uses: meson/configure
    with:
      opts: |
        -Dgst_debug=false \
        -Dbash-completion=enabled \
        -Dnls=enabled \
        -Dintrospection=enabled \
        -Ddoc=enabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: gstreamer-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - gstreamer=${{package.full-version}}
    description: gstreamer dev
