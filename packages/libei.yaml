package:
  name: libei
  version: 1.6.0
  epoch: 0
  description: "library for Emulated Input"
  url: https://gitlab.freedesktop.org/libinput/libei
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - systemd-dev
      - libevdev-dev
      - libxkbcommon-dev
      - python-3.13
      - py3.13-jinja2
      - ruff

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/libinput/libei
      tag: ${{package.version}}
      expected-commit: 8a46bf3d4b6af7f25a61be53386cf618218114ef

  - uses: meson/configure
    with:
      opts: |
        -Dtests=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libei-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libei=${{package.full-version}}
    description: libei dev
