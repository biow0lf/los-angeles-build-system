package:
  name: libao
  version: 1.2.0
  epoch: 0
  description: "Cross Platform Audio Output Library"
  url: "https://xiph.org/ao/"
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - alsa-lib-dev
      - pulseaudio-dev

pipeline:
  - uses: fetch
    with:
      uri: https://downloads.xiph.org/releases/ao/libao-1.2.0.tar.gz
      expected-sha256: 03ad231ad1f9d64b52474392d63c31197b0bc7bd416e58b1c10a329a5ed89caf

  # Fedora patches
  - uses: patch
    with:
      patches: |
          0001-ao_pulse.c-fix-latency-calculation.patch
          d5221655dfd1a2156aa6be83b5aadea7c1e0f5bd.diff
          libao-nanosleep.patch

  # TODO: check and remove usr/lib/ao/plugins-4/liboss.so
  - uses: autoconf/configure
    with:
      opts: |
        --disable-silent-rules \
        --disable-static \
        --disable-esd \
        --enable-alsa \
        --disable-arts \
        --disable-nas \
        --enable-pulse

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libao-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libao=${{package.full-version}}
    description: libao dev
