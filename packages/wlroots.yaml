package:
  name: wlroots
  version: 0.20.2
  epoch: 0
  description: "A modular Wayland compositor library"
  url: https://gitlab.freedesktop.org/wlroots/wlroots/
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - wayland-dev
      - wayland-protocols-dev>=1.49
      - libdrm-dev
      - libxkbcommon-dev
      - pixman-dev
      - libudev-dev
      - hwdata-dev
      - cairo-dev
      - libinput-dev
      - xcb-util-renderutil-dev
      - mesa-dev
      - mesa-gbm

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/wlroots/wlroots.git
      tag: ${{package.version}}
      expected-commit: d783533489e1f75d6886c2ab5c5960090ef268f8

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: wlroots-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - wlroots
    description: wlroots dev

