package:
  name: xdg-desktop-portal-hyprland
  version: 1.5.0
  epoch: 0
  description: "xdg-desktop-portal backend for Hyprland"
  url: https://github.com/hyprwm/xdg-desktop-portal-hyprland
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - hyprtoolkit-dev
      - hyprutils-dev
      - libdrm-dev
      - hyprwayland-scanner
      - pipewire-dev
      - sdbus-cpp-dev
      - hyprland-protocols

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/xdg-desktop-portal-hyprland
      tag: v${{package.version}}
      expected-commit: d1467fea8d1895cb7835829c2fbb271a0d37760a

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip
