package:
  name: labwc
  version: 0.20.3
  epoch: 0
  description: "A Wayland window-stacking compositor"
  url: https://labwc.github.io/
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - wlroots

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson
      - wlroots-dev
      - wayland-protocols-dev
      - glib-dev
      - cairo-dev
      - pango-dev
      - librsvg-dev
      - libsfdo-dev
      - libinput-dev
      - scdoc
      - xcb-util-wm-dev
      - xwayland-dev
      - cmocka-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/labwc/labwc.git
      tag: ${{package.version}}
      expected-commit: e0a3970b0c70e321814e8004ff7c6dbc7aeaf884

  - uses: meson/configure
    with:
      opts: |
        -Dtest=enabled

  - uses: meson/compile

  - uses: upstream-tests/meson-test

  - uses: meson/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: labwc/labwc
