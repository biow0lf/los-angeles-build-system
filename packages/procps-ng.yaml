package:
  name: procps-ng
  version: 4.0.7
  epoch: 1
  description: "System and process monitoring utilities"
  url: https://gitlab.com/procps-ng/procps/
  copyright:
    - license: "GPL-2.0-or-later"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - ncurses-dev
      - systemd-dev

pipeline:
  - uses: fetch
    with:
      uri: https://sourceforge.net/projects/procps-ng/files/Production/procps-ng-4.0.7.tar.xz
      expected-sha256: 9d2021f47a4501c667862c9942a92d1953694b21d11bcd1702e83eb594e3d67d

  - uses: autoconf/configure
    with:
      opts: |
        --exec-prefix=/usr \
        --sbindir=/usr/bin \
        --disable-static \
        --disable-w-from \
        --disable-kill \
        --enable-watch8bit \
        --enable-skill \
        --enable-sigwinch \
        --enable-libselinux \
        --with-systemd \
        --disable-modern-top \
        --enable-pidwait

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: "procps-ng-dev"
    description: "procps-ng dev"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - procps-ng=${{package.full-version}}
