package:
  name: xwayland
  version: 24.1.14
  epoch: 0
  description: "XWayland"
  url: https://gitlab.freedesktop.org/xorg/xserver
  copyright:
    - license: ""

environment:
  contents:
    packages:
      - build-base
      - busybox
      - libx11-dev
      - xtrans-dev
      - libxshmfence-dev
      - pixman-dev
      - xkbcomp-dev
      - libxfont-dev
      - libbsd-dev
      - systemd-dev
      - libxcvt-dev
      - font-util-dev
      - wayland-dev
      - wayland-protocols-dev
      - libdrm-dev
      - libepoxy-dev
      - mesa-dev
      - mesa-gbm
      - libtirpc-dev
      - audit-dev
      - xmlto
      - libxslt

pipeline:
  - uses: fetch
    with:
      uri: https://xorg.freedesktop.org/archive/individual/xserver/xwayland-24.1.14.tar.xz
      expected-sha256: 4eb6b98d678299a4b96138d886345b294130695760345ef84596225a8224078a

  # TODO: Run-time dependency libdecor-0 found: NO  (tried pkg-config and cmake)
  # TODO: Run-time dependency libei-1.0 found: NO  (tried pkg-config and cmake)
  # TODO: Run-time dependency liboeffis-1.0 found: NO  (tried pkg-config and cmake)
  # TODO: Run-time dependency xorg-sgml-doctools found: NO  (tried pkg-config and cmake)
  # TODO: Program fop found: NO
  # TODO: Program rendercheck found: NO
  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: xwayland-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - xwayland=${{package.full-version}}
    description: xwayland dev
