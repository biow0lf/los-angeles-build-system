package:
  name: tomlplusplus
  version: 3.4.0
  epoch: 0
  description: "TOML config file parser and serializer for C++"
  url: https://marzer.github.io/tomlplusplus/
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson
      - cmake

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/marzer/tomlplusplus
      tag: v${{package.version}}
      expected-commit: 30172438cee64926dc41fdd9c11fb3ba5b2ba9de

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

