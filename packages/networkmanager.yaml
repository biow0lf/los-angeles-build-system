package:
  name: networkmanager
  version: 1.58.1
  epoch: 0
  description: Network Management daemon
  url: https://networkmanager.dev/
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - perl
      - util-linux-dev
      - libudev-dev
      - dbus-dev
      - libndp-dev
      - glib-dev
      - systemd-dev
      - gobject-introspection-dev
      - libbpf-dev
      - jansson-dev
      - audit-dev
      - polkit-dev
      - gnutls-dev
      - libnss-dev
      - modemmanager-dev
      - mobile-broadband-provider-info
      - libpsl-dev
      - curl-dev
      - libnvme-dev
      - python-3.13
      - py3.13-gobject3
      # - py3-supported-gobject3
      - iptables
      - readline-dev
      - vala
      - glib-gir

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/archive/${{package.version}}/NetworkManager-${{package.version}}.tar.bz2
      expected-sha256: 50f0beefa02ff16159177e88379d7819edf6527b2cc25639ab4e62d8a15ca127

  # TODO: You must have libnewt installed to build nmtui. Use -Dnmtui=false to disable it
  # TODO: Run-time dependency libsystemd-login found: NO  (tried pkg-config and cmake)
  # TODO: Message: dhcpcd not found, assume path /usr/sbin/dhcpcd
  # TODO: Program resolvconf found: YES (/usr/bin/resolvconf)
  - uses: meson/configure
    with:
      opts: |
        -D ppp=false \
        -D nmtui=false \
        -D clat=false \
        -D sbindir=/usr/bin

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: networkmanager-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - networkmanager=${{package.full-version}}
    description: networkmanager dev
