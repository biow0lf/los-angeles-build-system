package:
  name: linux-zen
  version: 7.3.5
  epoch: 0 # zen1
  description: Linux ZEN
  url: https://github.com/zen-kernel/zen-kernel
  copyright:
    - license: "GPL-2.0-only"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - patch
      - zstd
      - flex
      - bison
      - rust-1.99
      - openssl-4.0
      - openssl-4.0-dev
      - elfutils-dev
      - diffutils
      - findutils
      - bash
      - bash-binsh
      - gnutar
      - perl
      - grep
      - xz
      - make
      - coreutils
      - gawk
      - cpio
      - sed
      - bc
      - posix-libc-utils
      - kmod

pipeline:
  - uses: fetch
    with:
      uri: https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.5.tar.xz
      expected-sha256: 8f293f83d54f0b7b9be56863ebc5e4ea79d73e530b4ae55c572be97ef39f0990
      extract: false

  - uses: fetch
    with:
      uri: https://github.com/zen-kernel/zen-kernel/releases/download/v7.3.5-zen1/linux-v7.3.5-zen1.patch.zst
      expected-sha256: ea9da7c9d1193a3de19e7b8c4e65944a0eb8c4931698d3345ed2de7b40b091b6
      extract: false

  - runs: |
      set -x

      make --version
      ls --version
      gawk --version
      cpio --version
      wget --version
      sed --version
      bc --version
      ldd --version
      zstdcat --version
      patch --version
      sh --version
      bash --version
      tar --version
      find --version
      diff --version
      flex --version
      bison --version
      perl --version
      grep --version
      openssl --version
      kmod --version

      tar xf linux-${{package.version}}.tar.xz

      pushd linux-${{package.version}}
        zstdcat ../linux-v${{package.version}}-zen1.patch.zst | patch -p1

        echo "Setting config..."

        cp ../config.x86_64 .config

        make olddefconfig V=1

        diff -u .config.old .config || true

        make -s kernelrelease > version

        echo "Prepared linux-zen version $(<version)"

        make all -j$(nproc)

        mkdir -p "${{targets.destdir}}/usr/lib/modules"
        mkdir -p "${{targets.destdir}}/boot"

        ln -s usr/lib/ ${{targets.destdir}}/lib

        make modules_install INSTALL_MOD_PATH="${{targets.destdir}}" INSTALL_MOD_STRIP=1

        cp arch/x86/boot/bzImage "${{targets.destdir}}/boot/vmlinuz-${{package.version}}-zen1"
        cp System.map "${{targets.destdir}}/boot/System.map-${{package.version}}-zen1"
        cp .config "${{targets.destdir}}/boot/config-${{package.version}}-zen1"

        rm -f "${{targets.destdir}}/lib/modules/${{package.version}}-zen1/build"

        rm -f "${{targets.destdir}}/lib"
      popd
