name: Image build

# Same build-and-boot-test pipeline as nightly-image.yml, but triggered
# synchronously by changes that can actually break it -- apko/**,
# Makefile, docker/builder/** (the toolchain image), image/** and
# test/** -- instead of only nightly/manual. Without this, a change to
# the image-assembly pipeline itself (e.g. the glibc lockfile-splicing
# fix in apko/generate-lockfile.sh) gets no CI signal until the next
# 07:00 UTC cron run.
#
# packages/** and pipelines/** are deliberately NOT in this filter: those
# are build-packages.yml's job (source-package correctness), and
# including them here would just double-run a full package rebuild on
# every package change for no extra coverage this workflow doesn't
# already get from the nightly run.
on:
  push:
    branches: [main]
    paths: ["apko/**", "Makefile", "docker/builder/**", "image/**", "test/**"]
  pull_request:
    paths: ["apko/**", "Makefile", "docker/builder/**", "image/**", "test/**"]
  workflow_dispatch: {}

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write signing key
        run: |
          mkdir -p keys
          echo "${{ secrets.MELANGE_SIGNING_KEY_B64 }}" | base64 -d > keys/melange.rsa

      - name: Build packages
        run: |
          set -eu
          for f in packages/*.yaml; do
            make build-package PKG="$(basename "$f" .yaml)"
          done
          make build-index

      - name: Build disk image
        run: make build-image

      - name: Boot smoke test (QEMU)
        run: make test-boot

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-boot-log
          path: work/boot.log
          retention-days: 14
