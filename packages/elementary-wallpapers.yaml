package:
  name: elementary-wallpapers
  version: 8.0.0
  epoch: 0
  description: "elementary OS Wallpapers"
  url: https://github.com/elementary/wallpapers
  copyright:
    - license: "distributable"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/elementary/wallpapers
      tag: ${{package.version}}
      expected-commit: 2ae7f028a7d807864bdc6b28947d5eb3f36add61

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
