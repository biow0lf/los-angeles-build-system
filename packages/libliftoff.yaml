package:
  name: libliftoff
  version: 0.5.0
  epoch: 0
  description: "Lightweight KMS plane library"
  url: https://gitlab.freedesktop.org/emersion/libliftoff/
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - libdrm-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/emersion/libliftoff
      tag: v${{package.version}}
      expected-commit: 8b08dc1c14fd019cc90ddabe34ad16596b0691f4

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libliftoff-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libliftoff=${{package.full-version}}
    description: libliftoff dev
