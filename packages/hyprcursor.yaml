package:
  name: hyprcursor
  version: 0.1.13
  epoch: 0
  description: "The hyprland cursor format, library and utilities"
  url: https://github.com/hyprwm/hyprcursor
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cairo-dev
      - hyprlang-dev
      - tomlplusplus
      - librsvg-dev
      - libzip-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprcursor
      tag: v${{package.version}}
      expected-commit: 44e91d467bdad8dcf8bbd2ac7cf49972540980a5

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: hyprcursor-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - hyprcursor=${{package.full-version}}
    description: hyprcursor dev
