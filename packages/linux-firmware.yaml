# https://gitlab.alpinelinux.org/alpine/aports/-/blob/master/main/linux-firmware/APKBUILD
package:
  name: linux-firmware
  version: 20261124
  epoch: 0
  description: "Firmware files for linux"
  url: "https://gitlab.com/kernel-firmware/linux-firmware"
  copyright:
    - license: "Custom"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - xz
      - rdfind
      - coreutils

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.com/kernel-firmware/${{package.name}}/-/archive/${{package.version}}/${{package.name}}-${{package.version}}.tar.bz2
      expected-sha256: 27e7c722133c7efdcd485b2eb50649e436dd89c4c85af479c916c544342bb8d4

  - runs: |
      make DESTDIR="${{targets.destdir}}/" FIRMWAREDIR=/usr/lib/firmware install-xz
      make DESTDIR="${{targets.destdir}}/" FIRMWAREDIR=/usr/lib/firmware dedup
