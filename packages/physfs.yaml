package:
  name: physfs
  version: 3.2.0
  epoch: 0
  description: "A portable, flexible file i/o abstraction"
  url: https://github.com/icculus/physfs
  copyright:
    - license: "Zlib"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake-3

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/icculus/physfs/archive/refs/tags/release-${{package.version}}.tar.gz
      expected-sha256: 1991500eaeb8d5325e3a8361847ff3bf8e03ec89252b7915e1f25b3f8ab5d560

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: physfs-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - physfs=${{package.full-version}}
    description: physfs dev
