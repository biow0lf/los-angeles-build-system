package:
  name: hyprgraphics
  version: 0.5.1
  epoch: 0
  description: "Hyprland graphics / resource utilities"
  url: https://github.com/hyprwm/hyprgraphics
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - libglvnd-dev
      - hyprutils-dev
      - libdrm-dev
      - pixman-dev
      - cairo-dev
      - libjpeg-turbo-dev
      - pango-dev
      - libwebp-dev
      - libmagic-dev
      - librsvg-dev
      - libjxl-dev
      - libheif-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprgraphics
      tag: v${{package.version}}
      expected-commit: 482d4b7ec36ffdaf3573086aa586b178fd5404be

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: hyprgraphics-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - hyprgraphics=${{package.full-version}}
    description: hyprgraphics dev
