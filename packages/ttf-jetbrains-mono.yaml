package:
  name: ttf-jetbrains-mono
  version: 2.304
  epoch: 0
  description: "Typeface for developers, by JetBrains"
  url: https://jetbrains.com/lp/mono
  copyright:
    - license: "SIL OPEN FONT LICENSE Version 1.1"

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://download.jetbrains.com/fonts/JetBrainsMono-${{package.version}}.zip
      expected-sha256: 6f6376c6ed2960ea8a963cd7387ec9d76e3f629125bc33d1fdcd7eb7012f7bbf
      extract: false

  - name: "Install fonts..."
    runs: |
      mkdir -p ${{targets.destdir}}/usr/share/fonts/ttf/

      unzip JetBrainsMono-${{package.version}}.zip

      find fonts/ttf -type f -name '*.ttf' -exec \
        install -Dm644 -t "${{targets.destdir}}/usr/share/fonts/ttf" {} \;

      mkdir -p ${{targets.destdir}}/usr/share/doc/${{package.name}}/

      install -Dm644 OFL.txt "${{targets.destdir}}/usr/share/doc/${{package.name}}/LICENSE"
