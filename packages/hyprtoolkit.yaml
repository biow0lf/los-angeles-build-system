package:
  name: hyprtoolkit
  version: 0.6.0
  epoch: 0
  description: "A modern C++ Wayland-native GUI toolkit"
  url: https://github.com/hyprwm/hyprtoolkit
  copyright:
    - license: "BSD-3"

# TODO: 2026/10/21 22:18:09 INFO -- Checking for module 'libinotify'
#       2026/10/21 22:18:09 INFO --   Package 'libinotify' not found
environment:
  contents:
    packages:
      - build-base
      - busybox
      - libglvnd-dev
      - hyprwayland-scanner
      - libdrm-dev
      - pixman-dev
      - wayland-dev
      - wayland-protocols-dev
      - pango-dev
      - hyprlang-dev
      - hyprutils-dev
      - iniparser-dev
      - libxkbcommon-dev
      - mesa-dev
      - aquamarine-dev
      - hyprgraphics-dev
      - abseil-cpp-20250127-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprtoolkit
      tag: v${{package.version}}
      expected-commit: f8cbaf42e1f7fdc9c7565d7be3e935f6d56c7a39

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: hyprtoolkit-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - hyprtoolkit=${{package.full-version}}
    description: hyprtoolkit dev
