package:
  name: dos2unix
  version: 7.5.7
  epoch: 0
  description: "Text file format converters"
  url: https://waterlander.net/dos2unix/
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - perl-utils
      - posix-libc-utils-bin

pipeline:
  - uses: fetch
    with:
      uri: https://downloads.sourceforge.net/dos2unix/dos2unix-7.5.7.tar.gz
      expected-sha256: 669ee27120ae71589f638fe3a167d6ea54f8633f5ab1b282551bd7a7c9510dfa

  - runs: |
      make

  - runs: |
      make check

  - runs: |
      make install DESTDIR=${{targets.destdir}}
