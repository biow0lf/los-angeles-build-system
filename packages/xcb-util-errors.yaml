package:
  name: xcb-util-errors
  version: 1.0.1
  epoch: 0
  description: "XCB utility library that gives human readable names to error, event, & request codes"
  url: https://gitlab.freedesktop.org/xorg/lib/libxcb-errors/
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/xorg/lib/libxcb-errors/
      tag: xcb-util-errors-${{package.version}}
      expected-commit: 517dd82c079de762a7426f20166a44f11e8d38c5
      recurse-submodules: true

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: xcb-util-errors-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - xcb-util-errors=${{package.full-version}}
    description: xcb-util-errors dev
