package:
  name: dust
  version: 1.2.7
  epoch: 0
  description: "A more intuitive version of du in rust"
  url: https://github.com/bootandy/dust
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bootandy/dust
      tag: v${{package.version}}
      expected-commit: 079c55266917387e416e0f871c97c06da52df12d

  # TODO: install man and bash/etc completions
  - uses: cargo/build
    with:
      output: dust

  - uses: strip
