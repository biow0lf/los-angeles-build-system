package:
  name: libxfce4ui
  version: 4.20.0
  epoch: 0
  description: "library is used to share commonly used Xfce widgets among the Xfce applications"
  url: https://www.xfce.org
  copyright:
    - license: LGPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - glib-dev
      - gtk-3-dev
      - libxfce4util-dev
      - xfconf-dev
      - gtk-doc
      - gobject-introspection-dev
      - vala
      - glib-gir
      - startup-notification-dev

pipeline:
  - uses: fetch
    with:
      uri: https://archive.xfce.org/xfce/4.20/src/libxfce4ui-4.20.0.tar.bz2
      expected-sha256: 75e8996984f20375aadecd5c16f5147c211ed0bd26d7861ab0257561eb76eaee

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libxfce4ui-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libxfce4ui=${{package.full-version}}
    description: libxfce4ui dev
