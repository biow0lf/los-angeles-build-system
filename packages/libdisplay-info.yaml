package:
  name: libdisplay-info
  version: 0.4.0
  epoch: 0
  description: "EDID and DisplayID library"
  url: https://gitlab.freedesktop.org/emersion/libdisplay-info
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - hwdata-dev
      - hwdata-usb
      - hwdata-pci
      - hwdata-pnp
      - hwdata-net
      - python-3.13

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/emersion/libdisplay-info
      tag: ${{package.version}}
      expected-commit: c67a3e9bedb05ab61c7443704a1a107e76254595

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libdisplay-info-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libdisplay-info=${{package.full-version}}
    description: libdisplay-info dev
