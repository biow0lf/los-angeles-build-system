package:
  name: exo
  version: 4.20.0
  epoch: 0
  description: "exo is an extension library used in the Xfce desktop"
  url: https://www.xfce.org
  copyright:
    - license: GPL-2.0-or-later AND LGPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - glib-dev
      - gtk-3-dev
      - libxfce4util-dev
      - libxfce4ui-dev
      - gtk-doc

pipeline:
  - uses: fetch
    with:
      uri: https://archive.xfce.org/xfce/4.20/src/exo-4.20.0.tar.bz2
      expected-sha256: 4277f799245f1efde01cd917fd538ba6b12cf91c9f8a73fe2035fd5456ec078d

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: exo-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - exo=${{package.full-version}}
    description: exo dev
