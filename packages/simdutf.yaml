package:
  name: simdutf
  version: 9.0.0
  epoch: 0
  description: "The simdutf package contains a library used for processing Unicode characters with SIMD optimizations"
  url: https://github.com/simdutf/simdutf
  copyright:
    - license: Apache 2.0 OR MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - python-3.13

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/simdutf/simdutf/archive/v9.0.0/simdutf-9.0.0.tar.gz
      expected-sha256: fd2ce975f29809a975a8da8843cfb3a7265af3f71be548f199d23cf65e101764

  - uses: cmake/configure
    with:
      opts: |
        -D BUILD_SHARED_LIBS=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: simdutf-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - simdutf=${{package.full-version}}
    description: simdutf dev
