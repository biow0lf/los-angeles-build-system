package:
  name: gstreamer
  version: 1.28.9
  epoch: 0
  description: "Media framework"
  copyright:
    - license: LGPL-2.1

environment:
  contents:
    packages:
      - build-base
      - busybox
      - bash-completion
      - python-3.13
      - flex
      - bison
      - glib-dev
      - gobject-introspection-dev
      - glib-gir

pipeline:
  - uses: fetch
    with:
      uri: https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-1.28.9.tar.xz
      expected-sha256: 6dbf744f583131a34845cc641e803843766a9ba80ce00378a9043fd6d8d5fb38

  - uses: meson/configure
    with:
      opts: |
        -Dgst_debug=false \
        -Dbash-completion=enabled \
        -Dnls=enabled \
        -Dintrospection=enabled \
        -Ddoc=enabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: gstreamer-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - gstreamer=${{package.full-version}}
    description: gstreamer dev
