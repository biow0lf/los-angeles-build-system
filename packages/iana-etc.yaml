package:
  name: iana-etc
  version: 20261022
  epoch: 0
  description: "/etc/protocols and /etc/services files from IANA's Assigned Internet Protocol Numbers"
  url: https://github.com/Mic92/iana-etc/
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - busybox
      - wolfi-baselayout

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/Mic92/iana-etc/releases/download/20261022/iana-etc-20261022.tar.gz
      expected-sha256: 8ea9429c691634056ad8c292cf94df8e4cc5e828dceef658490bcbab132dee7c

  - runs: |
      mkdir -p "${{targets.destdir}}/etc"

      install -m 644 services protocols "${{targets.destdir}}/etc"
