package:
  name: hypridle
  version: 0.1.8
  epoch: 0
  description: "Hyprland's idle daemon"
  url: https://github.com/hyprwm/hypridle
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - hyprwayland-scanner
      - wayland-dev
      - wayland-protocols-dev
      - hyprlang-dev
      - hyprutils-dev
      - sdbus-cpp-dev
      - hyprland-protocols

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hypridle
      tag: v${{package.version}}
      expected-commit: e5c01af0842bd66617f7004568df9406111d6e80

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip
