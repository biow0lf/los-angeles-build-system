package:
  name: vte
  version: 0.84.1
  epoch: 0
  description: "Virtual Terminal library"
  url: https://gitlab.gnome.org/GNOME/vte
  copyright:
    - license: "GPL-3.0-or-later AND LGPL-3.0-or-later AND MIT AND X11 AND CC-BY-4.0"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cairo-dev
      - pango-dev
      - lz4-dev
      - simdutf-dev
      - fmt-dev
      - gnutls-dev
      - gtk-3-dev
      - gtk-4-dev
      - fast_float
      - gobject-introspection-dev
      - vala
      - glib-gir

pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.gnome.org/GNOME/vte/-/archive/0.84.1/vte-0.84.1.tar.bz2
      expected-sha256: 2a88e4322852f62e5ee54b8aad10b4f8010e54d017756f0a5bd672cc8ea21476

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: vte-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - vte=${{package.full-version}}
    description: vte dev
