package:
  name: garcon
  version: 4.20.0
  epoch: 0
  description: "Implementation of the compliant menu specification"
  url: https://www.xfce.org
  copyright:
    - license: LGPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - glib-dev
      - gtk-3-dev
      - libxfce4util-dev
      - libxfce4ui-dev
      - gtk-doc
      - gobject-introspection-dev
      - glib-gir

pipeline:
  - uses: fetch
    with:
      uri: https://archive.xfce.org/xfce/4.20/src/garcon-4.20.0.tar.bz2
      expected-sha256: 7fb8517c12309ca4ddf8b42c34bc0c315e38ea077b5442bfcc4509415feada8f

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: garcon-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - garcon=${{package.full-version}}
    description: garcon dev
