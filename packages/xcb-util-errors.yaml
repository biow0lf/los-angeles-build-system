package:
  name: xcb-util-errors
  version: 1.0.1
  epoch: 0
  description: "XCB utility library that gives human readable names to error, event, & request codes"
  url: https://gitlab.freedesktop.org/xorg/lib/libxcb-errors/
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - libxcb-dev
      - util-macros-dev
      - doxygen
      - python-3.13

pipeline:
  - uses: fetch
    with:
      uri: https://xcb.freedesktop.org/dist/xcb-util-errors-1.0.1.tar.xz
      expected-sha256: 5628c87b984259ad927bacd8a42958319c36bdf4b065887803c9d820fb80f357

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: xcb-util-errors-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - xcb-util-errors=${{package.full-version}}
    description: xcb-util-errors dev
