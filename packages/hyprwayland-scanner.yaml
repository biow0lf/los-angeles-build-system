package:
  name: hyprwayland-scanner
  version: 0.4.6
  epoch: 0
  description: "A Hyprland implementation of wayland-scanner, in and for C++"
  url: https://github.com/hyprwm/hyprwayland-scanner
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - pugixml-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprwayland-scanner
      tag: v${{package.version}}
      expected-commit: b8632713a6beaf28b56f2a7b0ab2fb7088dbb404

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip
