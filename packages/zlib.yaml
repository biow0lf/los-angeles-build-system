# TODO: cmake + ctest
package:
  name: zlib
  version: 1.4
  epoch: 0
  description: "a library implementing the zlib compression algorithms"
  url: https://www.zlib.net/
  copyright:
    - license: MPL-2.0 AND MIT
  dependencies:
    runtime:
      - merged-lib
      - wolfi-baselayout
  cpe:
    vendor: zlib
    product: zlib

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/madler/zlib/releases/download/v1.4/zlib-1.4.tar.xz
      expected-sha256: 4f11c512053d7bab8d9e9b89bde3575add3e4c50a383b42ef6cb837035fc5a7c

  - uses: cmake/configure
    with:
      opts: |
        -DZLIB_BUILD_SHARED=ON \
        -DZLIB_BUILD_STATIC=ON \
        -DZLIB_BUILD_TESTING=ON \
        -DZLIB_BUILD_MINIZIP=ON \
        -DMINIZIP_BUILD_SHARED=ON \
        -DMINIZIP_BUILD_STATIC=OFF \
        -DMINIZIP_BUILD_TESTING=ON \
        -DMINIZIP_INSTALL=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: "zlib-static"
    description: "zlib static library"
    pipeline:
      - uses: split/static
    dependencies:
      runtime:
        - merged-lib
        - wolfi-baselayout

  - name: "minizip"
    description: "a library for manipulation with files from .zip archives"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"

          mv "${{targets.destdir}}/usr/bin/minizip" "${{targets.contextdir}}/usr/bin"
          mv "${{targets.destdir}}/usr/bin/miniunzip" "${{targets.contextdir}}/usr/bin"

          mkdir -p "${{targets.contextdir}}/usr/include/minizip"

          mv "${{targets.destdir}}/usr/include/minizip" "${{targets.contextdir}}/usr/include/"

          mkdir -p "${{targets.contextdir}}/usr/lib/cmake/minizip"

          mv "${{targets.destdir}}/usr/lib/cmake/minizip" "${{targets.contextdir}}/usr/lib/cmake/"

          mkdir -p "${{targets.contextdir}}/usr/lib"

          mv "${{targets.destdir}}/usr/lib/libminizip.so" "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}/usr/lib/libminizip.so.1" "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}/usr/lib/libminizip.so.1.4" "${{targets.contextdir}}/usr/lib"

          mkdir -p "${{targets.contextdir}}/usr/lib/pkgconfig"

          mv "${{targets.destdir}}/usr/lib/pkgconfig/minizip.pc" "${{targets.contextdir}}/usr/lib/pkgconfig"
    dependencies:
      runtime:
        - merged-lib
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: madler/zlib
    strip-prefix: v
