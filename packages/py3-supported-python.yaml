package:
  name: py3-supported-python
  version: 1
  # Deviation from Wolfi's own recipe: still trimmed to 3.10/3.11/3.12/3.13
  # (dropping 3.14). python-3.14 itself IS self-hosted now, but Wolfi's own
  # recipe doesn't route 3.14 through this package's ranged
  # py${{range.key}}-build-base pattern the same way -- it needs a parallel
  # set of standalone py3.14-build/py3.14-installer/py3.14-pip/etc. packages
  # (py3.14-installer.yaml and py3.14-flit-core.yaml already exist as
  # separate recipes upstream, outside py3-installer.yaml/py3-flit-core.yaml's
  # ranges, due to 3.14's free-threading build differences). That's separate
  # scope from the meson/wayland chain this trim exists to unblock, which
  # only needs 3.10-3.13. Tracked in BOOTSTRAP.md.
  epoch: 10
  description: metapackage to install all supported versions of python
  copyright:
    - license: "MIT"
  dependencies:
    runtime:
      - python-3.10-base
      - python-3.11-base
      - python-3.12-base
      - python-3.13-base
  resources:
    cpu: "10"
    memory: 4Gi

environment:
  contents:
    packages:
      - busybox

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

subpackages:
  - name: ${{package.name}}-dev
    description: metapackage to install all supported versions of python-dev
    dependencies:
      runtime:
        - python-3.10-base-dev
        - python-3.11-base-dev
        - python-3.12-base-dev
        - python-3.13-base-dev
    test:
      pipeline:
        - uses: test/tw/metapackage

  - range: py-versions
    name: py${{range.key}}-build-base
    description: python ${{range.key}} core/base build packages.
    dependencies:
      runtime:
        - busybox
        - py${{range.key}}-build
        - py${{range.key}}-installer
        - py${{range.key}}-pip-base
        - py${{range.key}}-setuptools
        - py${{range.key}}-setuptools-scm
        - py${{range.key}}-wheel
      provides:
        - py3-build-base
      provider-priority: ${{range.value}}
    test:
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-build-base

  - name: py3-supported-build-base
    description: "metapackage for common python build-deps"
    dependencies:
      runtime:
        - py3.10-build-base
        - py3.11-build-base
        - py3.12-build-base
        - py3.13-build-base
    test:
      pipeline:
        - uses: test/tw/metapackage

  - range: py-versions
    name: py${{range.key}}-build-base-dev
    description: python ${{range.key}} core/base build packages with development headers.
    dependencies:
      runtime:
        - py${{range.key}}-build-base
        - python-${{range.key}}-base-dev
        - build-base
      provides:
        - py3-build-base-dev
      provider-priority: ${{range.value}}
    test:
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-build-base-dev

  - name: py3-supported-build-base-dev
    description: "metapackage for common python build-deps with C extensions"
    dependencies:
      runtime:
        - build-base
        - py3.10-build-base-dev
        - py3.11-build-base-dev
        - py3.12-build-base-dev
        - py3.13-build-base-dev
        - py3-supported-python-dev
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: false
  exclude-reason: No source to watch for the new versions

test:
  pipeline:
    - uses: test/tw/metapackage
