package:
  name: libmbim
  version: 1.34.0
  epoch: 0
  description: "Support library for the Mobile Broadband Interface Model protocol"
  url: https://gitlab.freedesktop.org/mobile-broadband/libmbim/
  copyright:
    - license: "LGPL-2.1-or-later"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - bash-completion
      - glib-dev
      - gobject-introspection-dev
      - python-3.13
      - help2man
      - glib-gir

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/mobile-broadband/libmbim/
      tag: ${{package.version}}
      expected-commit: 2bca5d22137883f348cb117597746483637491db

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: "libmbim-dev"
    description: "libmbim dev"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libmbim=${{package.full-version}}
