# Los Angeles Linux -- root filesystem specification.
#
# apko assembles this list of apk packages into a single OCI image tarball
# (no `RUN` steps -- fully declarative/reproducible). scripts/extract-rootfs.sh
# turns that tarball into a plain directory tree (work/rootfs/), which is the
# target rootfs for the image assembly pipeline in image/.
#
# The kernel and initramfs are NOT listed here -- Wolfi ships neither (it is
# a container-only "undistro" with no bootable-kernel packages at all), so
# they're taken from Alpine (linux-lts + mkinitfs) directly in the builder
# image instead; see image/build-disk-image.sh.
#
# Track A (borrowed as-is from Wolfi, glibc-based, itself melange-built) vs.
# Track B (los-angeles-linux-*, built by us) are marked below. See the
# self-hosting roadmap in the top-level plan for moving packages from A to B.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local packages-out"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - keys/melange.rsa.pub
  packages:
    # Track A
    - wolfi-baselayout
    - bash
    - coreutils
    - util-linux
    - e2fsprogs
    - dosfstools
    - systemd
    # Wolfi splits systemd-udevd out of the `systemd` package into `udev`
    # (distinct from `eudev`, the non-systemd fork) -- without it there's no
    # udevd running, so systemd never gets a "device found" event for
    # anything, including /dev/ttyS0, and every device unit times out.
    - udev
    - dbus
    - apk-tools
    - ca-certificates
    - openssh
    - iproute2
    - iputils
    # Track B: built by us, not borrowed
    - los-angeles-linux-release@local
    - los-angeles-linux-base@local
    # busybox and glibc-2.44 are the first two self-hosted packages (see
    # the plan's self-hosting roadmap): built from actual source via
    # packages/busybox.yaml and packages/glibc-2.44.yaml, not pulled from
    # Wolfi -- which also has same-named packages.
    #
    # busybox@local: verified (in isolation, via `apko lock`) to correctly
    # force our own build. Nothing else in this want-list needs busybox
    # satisfied through a separate, transitive constraint, so the pin is
    # unambiguous here.
    #
    # glibc-2.44 is deliberately NOT pinned here with @local. Pinning it
    # directly fixes the *direct* "glibc-2.44" want to our repo, but
    # apk-tools (and everything else) also needs so:libc.so.6 satisfied as
    # a *separate*, transitive constraint -- once the direct want is
    # pinned, the solver disqualifies every other glibc revision for that
    # edge (only one package may provide the shared "cmd:ldconfig") and
    # then fails outright, instead of reusing the pinned package to also
    # satisfy it. Bumping our epoch past Wolfi's, listing our repo first,
    # and bumping provider-priority were all tried too and made no
    # difference -- Wolfi's own live index isn't even a stable target to
    # race by version (observed its glibc-2.44 at both r0 and r6 within
    # one debugging session).
    #
    # Instead, `make build-rootfs` runs apko/generate-lockfile.sh first,
    # which locks apko/self-hosted.yaml (a minimal want-list containing
    # only glibc-2.44@local and glibc-2.44-iconv@local, where the @local
    # pin resolves cleanly since nothing else there creates a competing
    # so:-based edge) and splices those resolved entries over this
    # config's own lock. `apko build --lockfile=...` is then left no
    # other candidate for those names, so it installs ours -- verified:
    # `apko build --lockfile=...` installs glibc-2.44-2.44-r7 (ours, not
    # Wolfi's r6) end-to-end, and `make build-image && make test-boot`
    # still boots to multi-user.target.
    - busybox@local
    - glibc-2.44

  # Written to /etc/apk/repositories in the image so `apk add`/`apk upgrade`
  # work on a booted system (the mutable runtime model) -- not consulted at
  # apko build time. http://localhost:8080 is only correct for local dev
  # (`make serve-repo`); replace it with the real published repo URL once
  # one exists (see Phase 4 / repo hosting in the plan).
  # No runtime_keyring needed: apko installs contents.keyring above into
  # /etc/apk/keys of the built image automatically (that's how build-time
  # package verification is possible in the first place), so both keys are
  # already trusted at runtime -- a duplicate runtime_keyring entry with the
  # same filename collides with apko's own install of it.
  runtime_repositories:
    - https://packages.wolfi.dev/os
    - http://localhost:8080

archs:
  - x86_64

cmd: /bin/sh -l
