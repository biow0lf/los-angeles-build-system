package:
  name: edgepad
  version: 0.3.0
  epoch: 0
  description: "Touchpad edge gestures for Linux/Wayland"
  url: https://github.com/assembledev/edgepad
  copyright:
    - license: "Apache 2.0"

# TODO: add examples and docs
environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/assembledev/edgepad
      tag: v${{package.version}}
      expected-commit: 1240f5658b30495f5c816121f79a977ec155666b

  - uses: cargo/build
    with:
      output: edgepad

  - uses: strip
