package:
  name: linux-headers
  version: 7.3.4
  epoch: 0
  description: "The Linux kernel headers"
  url: https://kernel.org
  copyright:
    - license: GPL-2.0-only WITH Linux-syscall-note

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - scanelf
      - wolfi-baselayout

pipeline:
  - uses: fetch
    with:
      uri: https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${{package.version}}.tar.xz
      expected-sha256: b11b6df8295e8e991ff040b71aaa4994a8b55caa23b6b092907f195b5840fd1f

  - runs: |
      make mrproper

  - runs: |
      make headers

      find usr/include -type f ! -name '*.h' -delete

      mkdir -p ${{targets.destdir}}/usr/include/

      cp -rv usr/include ${{targets.destdir}}/usr/include/

test:
  environment:
    contents:
      packages:
        - build-base
        - header-check
  pipeline:
    - uses: test/tw/header-check
      with:
        files: "linux/types.h linux/ioctl.h linux/fs.h"
    - name: Compile test with kernel headers
      runs: |
        # Verify kernel headers are usable by compiling a C program
        tee test.c <<'EOF'
        #include <linux/types.h>
        #include <linux/ioctl.h>
        int main() {
            __u32 x = 0;
            return (int)x;
        }
        EOF

        gcc test.c -o test
        ./test
