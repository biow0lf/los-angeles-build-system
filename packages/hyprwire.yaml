package:
  name: hyprwire
  version: 0.3.1
  epoch: 0
  description: "A fast and consistent wire protocol for IPC"
  url: https://github.com/hyprwm/hyprwire
  copyright:
    - license: "BSD-3"

# Skip "epoll-shim". This is for FreeBSD.
environment:
  contents:
    packages:
      - build-base
      - busybox
      - pugixml-dev
      - libffi-dev
      - hyprutils-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprwire
      tag: v${{package.version}}
      expected-commit: 3e6865ce5fd9237b58f5b2ce5de18814df3baff5

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: hyprwire-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - hyprwire=${{package.full-version}}
    description: hyprwire dev
