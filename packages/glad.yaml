package:
  name: glad
  version: 2.0.8
  epoch: 0
  description: "Multi-Language Vulkan/GL/GLES/EGL/GLX/WGL Loader-Generator based on the official specs"
  url: https://github.com/Dav1dde/glad
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - python-3.13
      - py3.13-build
      - py3.13-setuptools
      - py3.13-installer

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/Dav1dde/glad/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: 44f06f9195427c7017f5028d0894f57eb216b0a8f7c4eda7ce883732aeb2d0fc

  - name: Build
    runs: |
      python3 -m build --wheel --no-isolation

  - name: Install
    runs: |
      python3 -m installer --destdir="${{targets.destdir}}" dist/*.whl
