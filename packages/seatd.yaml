package:
  name: seatd
  version: 0.9.3
  epoch: 2
  description: "A minimal seat management daemon, and a universal seat management library"
  url: https://github.com/kennylevinsen/seatd/
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - systemd-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kennylevinsen/seatd/archive/refs/tags/${{package.version}}.tar.gz
      expected-sha256: 302564d54d8e28191fadfd734f2675ecb0c9e0615a58011b89ef15dfa4dbaa96

  - uses: meson/configure
    with:
      opts: |
        -Dserver=disabled \
        -Dlibseat-seatd=disabled \
        -Dlibseat-logind=systemd \
        -Dexamples=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: seatd-dev
    description: seatd dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - seatd=${{package.full-version}}
