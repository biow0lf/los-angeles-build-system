package:
  name: umbriel
  version: 0.1.0
  epoch: 3 # new snapshot
  description: "A Wayland compositor built on wlroots"
  url: https://noctalia.dev/
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson
      - jemalloc-dev
      - wayland-dev
      - wayland-protocols-dev
      - wlroots-dev
      - tomlplusplus
      - nlohmann-json-dev
      - cairo-dev
      - pango-dev
      - bash
      - libei-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/noctalia-dev/umbriel
      depth: -1
      expected-commit: 1e84f566cb7b33c90ade005493805e0af3b24ec9

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
