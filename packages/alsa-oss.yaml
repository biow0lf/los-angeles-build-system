package:
  name: alsa-oss
  version: 1.1.8
  epoch: 0
  description: "Wrapper to facilitate use of the ALSA OSS compatibility library"
  url: https://www.alsa-project.org/wiki/Main_Page
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - file
      - alsa-lib-dev

pipeline:
  - uses: fetch
    with:
      uri: https://www.alsa-project.org/files/pub/oss-lib/alsa-oss-1.1.8.tar.bz2
      expected-sha256: 64adcef5927e848d2e024e64c4bf85b6f395964d9974ec61905ae4cb8d35d68e

  - uses: autoconf/configure
    with:
      opts: |
        --disable-static \
        --enable-shared

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: alsa-oss-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - alsa-oss=${{package.full-version}}
