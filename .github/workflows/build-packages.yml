name: Build packages

# Builds only new/modified packages/<name>.yaml (+ its aux dir), not
# every package on every push. This reintroduces a known gap: melange
# has no cross-package dependency graph, so bumping a foundational
# package (glibc, gcc, build-base, openssl, ...) only rebuilds that one
# package here -- nothing tells CI that every consumer needs rebuilding
# against it too. Accepted deliberately rather than paying a ~1.5h full
# rebuild on every push, regardless of size -- see
# rebuild-all-packages.yml (workflow_dispatch only, no publish) as the
# manual safety valve: run it after any foundational/shared-infra change
# (a package most others depend on, or Makefile/pipelines/**/
# docker/builder/** themselves) to verify nothing broke before trusting
# main. See BOOTSTRAP.md for more on this tradeoff.
#
# Trigger is packages/** only now -- Makefile, pipelines/**,
# docker/builder/**, apko/**, image/** and test/** changes no longer
# auto-trigger this workflow at all (they used to, specifically so a
# broken apko config got caught by boot-test before landing on main).
# Verify those manually via rebuild-all-packages.yml instead.
#
# Each package gets its own matrix job (rather than one job looping over
# all of them) so a slow, heavy package -- glibc's full upstream testsuite
# in particular -- doesn't make every unrelated package push wait on it;
# total wall-clock is the slowest single package, not the sum of all of
# them.
#
# boot-test (below) downloads this workflow's own packages-out artifact
# rather than rebuilding from source a second time.
on:
  push:
    branches: [main]
    paths: ["packages/**"]
  pull_request:
    paths: ["packages/**"]
  workflow_dispatch: {}

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Computes which packages actually need building (added/modified
  # packages/<name>.yaml or packages/<name>/* this push), and which were
  # removed entirely (deleted packages/<name>.yaml -- triggers pruning
  # from the published repo in the index job below, see that job's own
  # comment). Falls back to "every current package, nothing removed" --
  # the same full list this repo always used before incremental builds --
  # whenever there's no reliable base commit to diff against: a
  # workflow_dispatch run, or the rare new-branch case where
  # github.event.before is the all-zero SHA.
  discover:
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      removed: ${{ steps.list.outputs.removed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: list
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          all_pkgs() {
            for f in packages/*.yaml; do basename "$f" .yaml; done | sort -u
          }

          # echo always adds a trailing newline, which split("\n")[:-1]
          # relies on to drop a trailing empty element -- but echo of a
          # genuinely empty var ALSO adds that one newline, which would
          # otherwise come out as [""] instead of []. Special-case it.
          to_json_array() {
            if [ -z "$1" ]; then
              echo '[]'
            else
              printf '%s\n' "$1" | jq -R -s -c 'split("\n")[:-1]'
            fi
          }

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against -- building every package."
            pkgs_json=$(to_json_array "$(all_pkgs)")
            echo "packages=$pkgs_json" >> "$GITHUB_OUTPUT"
            echo "removed=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --no-renames --name-status "$BASE_SHA" "${{ github.sha }}" -- packages/ > /tmp/pkg-diff.txt

          # The `|| true` on each grep matters: with set -e -o pipefail, a
          # grep that matches nothing (a perfectly normal case here, e.g.
          # a push with no deletions) exits 1 and would otherwise abort
          # this whole script before it ever reaches the echo below.
          added_modified=$( (awk '$1 ~ /^[AM]/ {print $2}' /tmp/pkg-diff.txt \
            | grep -E '^packages/[^/]+\.yaml$|^packages/[^/]+/' \
            | sed -E 's#^packages/([^/]+)\.yaml$#\1#; s#^packages/([^/]+)/.*#\1#' \
            | sort -u) || true)
          # Defensive: only build names that actually have a
          # packages/<name>.yaml today (excludes incidental paths like
          # packages/.empty-source-dir/ from ever being "built").
          added_modified_valid=$(comm -12 <(echo "$added_modified") <(all_pkgs))

          removed=$( (awk '$1 == "D" {print $2}' /tmp/pkg-diff.txt \
            | grep -E '^packages/[^/]+\.yaml$' \
            | sed -E 's#^packages/([^/]+)\.yaml$#\1#' \
            | sort -u) || true)

          pkgs_json=$(to_json_array "$added_modified_valid")
          removed_json=$(to_json_array "$removed")
          echo "packages=$pkgs_json" >> "$GITHUB_OUTPUT"
          echo "removed=$removed_json" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Write signing key
        run: |
          mkdir -p keys
          echo "${{ secrets.MELANGE_SIGNING_KEY_B64 }}" | base64 -d > keys/melange.rsa

      - name: Build ${{ matrix.package }}
        run: make build-package PKG=${{ matrix.package }}

      - uses: actions/upload-artifact@v7
        with:
          name: apks-${{ matrix.package }}
          path: packages-out/x86_64/*.apk
          retention-days: 14

  # Merges this run's own fresh .apk files into the *currently published*
  # index -- not the currently published .apk files themselves. We only
  # ever need the old index's TEXT to preserve every untouched package's
  # entry (melange's --merge/--source doesn't re-read the old bytes --
  # confirmed directly against chainguard-dev/melange's pkg/index/index.go
  # during planning), so this job fetches a single object
  # (x86_64/APKINDEX.tar.gz) over plain public HTTP instead of syncing the
  # whole bucket -- no AWS credentials needed here at all.
  #
  # Before merging, baseline records whose `o:` origin is in EITHER
  # needs.discover.outputs.removed OR needs.discover.outputs.packages are
  # stripped out first: removed so they vanish from the index entirely
  # (and later get pruned from the bucket by publish), and this run's own
  # rebuilt packages so a version/epoch bump doesn't leave the OLD
  # version's entry sitting alongside the new one (melange's merge only
  # replaces an entry on an exact Name+Version match -- a changed version
  # string would otherwise just append a second entry instead of
  # replacing). Matching by origin, not filename, is what correctly drops
  # every subpackage a rebuilt/removed recipe produced (e.g. tcl also
  # drops tcl-dev/tcl-doc).
  #
  # The resulting packages-out artifact is now small: just this run's
  # fresh .apk files plus one signed index describing every still-valid
  # package, old and new.
  index:
    needs: [discover, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Write signing key
        run: |
          mkdir -p keys
          echo "${{ secrets.MELANGE_SIGNING_KEY_B64 }}" | base64 -d > keys/melange.rsa

      # No if-no-artifacts-found input exists on the pattern-based form of
      # this action (confirmed via actionlint) -- relying on its default
      # behavior tolerating zero matches (a push that only deletes a
      # package, so discover's packages output -- and this run's own
      # build matrix -- is legitimately empty). Flagged to confirm on the
      # first real zero-package-built run.
      - name: Download this run's built packages
        uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          path: packages-out/x86_64
          merge-multiple: true

      - name: Fetch and filter the published index (no package bytes)
        env:
          REMOVED_JSON: ${{ needs.discover.outputs.removed }}
          PACKAGES_JSON: ${{ needs.discover.outputs.packages }}
        run: |
          mkdir -p packages-out/x86_64 baseline/x86_64
          if ! curl -fsSL https://pub-3a8f2e6595544a6a883e17caa4383bdd.r2.dev/x86_64/APKINDEX.tar.gz \
              -o baseline/x86_64/APKINDEX.tar.gz; then
            echo "No published index yet (first-ever publish) -- nothing to merge in."
            exit 0
          fi
          tar -xzOf baseline/x86_64/APKINDEX.tar.gz APKINDEX > /tmp/baseline-APKINDEX

          exclude_names=$( (echo "$REMOVED_JSON" | jq -r '.[]'; echo "$PACKAGES_JSON" | jq -r '.[]') | sort -u)

          # Paragraph mode (RS=""): each record is one blank-line-separated
          # block. Reprint the whole block verbatim unless its o: origin is
          # in the exclude set -- confirmed this record format (P:/V:/o:
          # fields) directly against this repo's own real APKINDEX.tar.gz
          # during planning.
          awk -v RS='' -v ORS='\n\n' -v FS='\n' -v exclude="$exclude_names" '
            BEGIN { n = split(exclude, ex, "\n"); for (i=1;i<=n;i++) skip[ex[i]] = 1 }
            { O="";
              for (i=1;i<=NF;i++) if ($i ~ /^o:/) O=substr($i,3);
              if (!(O in skip)) print;
            }' /tmp/baseline-APKINDEX > /tmp/filtered-APKINDEX

          cp /tmp/filtered-APKINDEX APKINDEX
          tar -czf baseline/x86_64/APKINDEX.filtered.tar.gz APKINDEX
          rm -f APKINDEX
          echo "MERGE_SOURCE=baseline/x86_64/APKINDEX.filtered.tar.gz" >> "$GITHUB_ENV"

      - name: Rebuild signed index
        run: make build-index MERGE_SOURCE=${{ env.MERGE_SOURCE }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages-out
          path: packages-out/
          retention-days: 14

  # Assembles the disk image from the packages just built above (no
  # rebuild -- downloads this run's own packages-out artifact) and
  # boot-tests it in QEMU. Doesn't need the melange signing key: apko
  # only verifies against the already-committed public key
  # (keys/melange.rsa.pub), it doesn't sign anything itself.
  boot-test:
    needs: index
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: packages-out
          path: packages-out/

      # apko/los-angeles-linux.yaml and apko/self-hosted.yaml pin a fixed
      # set of package names directly to the "@local packages-out"
      # repository (solver-conflict/transitive-edge workarounds -- see
      # those files' own comments). @local forces resolution to that
      # literal local directory, so those specific names' .apk bytes must
      # physically exist here -- they can't fall back to a URL the way
      # everything else in the image's dependency graph now can (both
      # apko configs also list the published R2 repo as a plain,
      # untagged repository). The index artifact just downloaded already
      # describes every one of these by metadata (melange's merge keeps
      # every untouched entry), but only this run's own freshly-built
      # packages have bytes on disk -- fetch just the handful that are
      # still missing, by plain public HTTP (no AWS credentials needed).
      - name: Fetch @local-pinned packages not built this run
        run: |
          tar -xzOf packages-out/x86_64/APKINDEX.tar.gz APKINDEX > /tmp/APKINDEX
          awk -v RS='' -v FS='\n' '
            { P=""; V="";
              for (i=1;i<=NF;i++) {
                if ($i ~ /^P:/) P=substr($i,3);
                if ($i ~ /^V:/) V=substr($i,3);
              }
              if (P!="" && V!="") print P"\t"P"-"V".apk";
            }' /tmp/APKINDEX > /tmp/name-to-file.tsv

          grep -vE '^\s*#' apko/los-angeles-linux.yaml apko/self-hosted.yaml \
            | grep -oE '[A-Za-z0-9_.+-]+@local' \
            | sed 's/@local$//' \
            | sort -u > /tmp/local-pinned-names.txt

          while read -r name; do
            [ -z "$name" ] && continue
            fname=$(awk -F'\t' -v n="$name" '$1==n{print $2}' /tmp/name-to-file.tsv)
            if [ -z "$fname" ]; then
              echo "::error::no index entry for @local-pinned package $name"
              exit 1
            fi
            if [ ! -f "packages-out/x86_64/$fname" ]; then
              curl -fsSL "https://pub-3a8f2e6595544a6a883e17caa4383bdd.r2.dev/x86_64/$fname" \
                -o "packages-out/x86_64/$fname"
            fi
          done < /tmp/local-pinned-names.txt

      - name: Build disk image
        run: make build-image

      - name: Boot smoke test (QEMU)
        run: make test-boot

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-log
          path: work/boot.log
          retention-days: 14

  # Publishes the repo to our own Cloudflare R2 bucket (public-read via its
  # r2.dev dev subdomain) so `apk add`/`apk upgrade` on a booted Los
  # Angeles Linux system (the mutable runtime model) has something real to
  # point at -- only from main, never from a PR, and only once the packages
  # built above are confirmed to actually produce a bootable image (needs:
  # boot-test, not just index) -- a package that indexes fine but breaks
  # the final image should never reach the public repo.
  #
  # packages-out here only physically contains this run's fresh .apk files
  # plus the newly merged+signed index -- NOT a full mirror of the bucket
  # (see index job above) -- so publishing is now two deliberately
  # sequenced steps instead of one `sync --delete`:
  #
  #   1. Upload (additive only, no --delete): pushes just the new/changed
  #      files. Everything the index still references that wasn't
  #      touched this run is already sitting in the bucket untouched.
  #   2. Prune: only AFTER that upload lands, list the bucket's current
  #      keys and delete whichever ones the just-published index no
  #      longer references (a removed recipe's old files, or a rebuilt
  #      recipe's stale old-version file). Sequenced last on purpose --
  #      there must never be a window where the live index points at a
  #      file that's missing, but a brief window where a stale file
  #      outlives the index that no longer mentions it is harmless.
  #
  # R2 has no per-object ACLs (unlike Linode/AWS S3) -- public access is a
  # bucket-level setting already in place, so no --acl flag here. Region is
  # the literal string "auto", not a real AWS region -- R2's own S3 API
  # convention.
  publish:
    needs: boot-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages-out
          path: packages-out/

      - name: Upload new/changed packages and index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync packages-out/ s3://los-angeles-linux/ \
            --endpoint-url https://3cbfa894108429db9520d0e70906bcf0.r2.cloudflarestorage.com

      - name: Prune bucket objects no longer in the index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://3cbfa894108429db9520d0e70906bcf0.r2.cloudflarestorage.com
        run: |
          tar -xzOf packages-out/x86_64/APKINDEX.tar.gz APKINDEX > /tmp/final-APKINDEX
          awk -v RS='' -v FS='\n' '
            { P=""; V="";
              for (i=1;i<=NF;i++) {
                if ($i ~ /^P:/) P=substr($i,3);
                if ($i ~ /^V:/) V=substr($i,3);
              }
              if (P!="" && V!="") print "x86_64/" P "-" V ".apk";
            }' /tmp/final-APKINDEX > /tmp/keep-keys.txt
          echo "x86_64/APKINDEX.tar.gz" >> /tmp/keep-keys.txt

          aws s3api list-objects-v2 --bucket los-angeles-linux --prefix x86_64/ \
            --endpoint-url "$ENDPOINT" --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | grep -v '^None$' > /tmp/bucket-keys.txt || true

          comm -23 <(sort -u /tmp/bucket-keys.txt) <(sort -u /tmp/keep-keys.txt) > /tmp/stale-keys.txt

          while read -r key; do
            [ -z "$key" ] && continue
            echo "pruning $key"
            aws s3 rm "s3://los-angeles-linux/$key" --endpoint-url "$ENDPOINT"
          done < /tmp/stale-keys.txt
