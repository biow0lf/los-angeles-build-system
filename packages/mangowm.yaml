package:
  name: mangowm
  version: 0.18.3
  epoch: 0
  description: "A fast, feature-rich Wayland compositor built on dwl"
  url: https://mangowm.github.io/
  copyright:
    - license: "GPL-3.0-or-later"
  dependencies:
    runtime:
      - scenefx

environment:
  contents:
    packages:
      - build-base
      - busybox
      - wayland-dev
      - wayland-protocols-dev
      - libdrm-dev
      - libxcb-dev
      - xcb-util-wm-dev
      - wlroots-dev
      - scenefx-dev
      - cjson-dev
      - pango-dev
      - xwayland-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mangowm/mango/
      tag: ${{package.version}}
      expected-commit: 8b876cb31d4b0a393f4438e5a89b2f33a865d77b

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
