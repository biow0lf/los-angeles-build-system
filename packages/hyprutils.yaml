package:
  name: hyprutils
  version: 0.14.3
  epoch: 0
  description: "Hyprland utilities library used across the ecosystem"
  url: https://github.com/hyprwm/hyprutils
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - pixman-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprutils
      tag: v${{package.version}}
      expected-commit: 0d13d5a624eb093b600d1b2cbe448fb613c86424

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: hyprutils-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - hyprutils=${{package.full-version}}
    description: hyprutils dev
