package:
  name: aquamarine
  version: 0.16.0
  epoch: 0
  description: "Aquamarine is a very light linux rendering backend library"
  url: https://github.com/hyprwm/aquamarine
  copyright:
    - license: "BSD-3"

# Build without epoll-shim. This is FreeBSD code.
environment:
  contents:
    packages:
      - build-base
      - busybox
      - libglvnd-dev
      - hyprwayland-scanner
      - libdrm-dev
      - wayland-dev
      - wayland-protocols-dev
      - hyprutils-dev
      - pixman-dev
      - libudev-dev
      - mesa-dev
      - mesa-gbm
      - seatd-dev
      - libinput-dev
      - libdisplay-info-dev
      - hwdata-dev
      - hwdata-pnp

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/aquamarine
      tag: v${{package.version}}
      expected-commit: b77d67648336223a6c8fb88844ae316e7b72b574

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aquamarine-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aquamarine=${{package.full-version}}
    description: aquamarine dev
