package:
  name: hyprshutdown
  version: 0.1.2
  epoch: 0
  description: "A graceful shutdown utility for Hyprland"
  url: https://github.com/hyprwm/hyprshutdown
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - hyprtoolkit-dev
      - hyprutils-dev
      - libdrm-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprshutdown
      tag: v${{package.version}}
      expected-commit: 932dcf06320da94e5f7fa73cf449e8b8c394bf9d

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip
