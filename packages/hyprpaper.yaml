package:
  name: hyprpaper
  version: 0.8.5
  epoch: 1 # libaquamarine.so.14
  description: "Hyprpaper is a wayland wallpaper utility with IPC controls"
  url: https://github.com/hyprwm/hyprpaper
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - hyprwayland-scanner
      - libdrm-dev
      - hyprwire-dev
      - hyprutils-dev
      - pixman-dev
      - wayland-dev
      - hyprlang-dev
      - hyprtoolkit-dev
      - libmagic-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprpaper
      tag: v${{package.version}}
      expected-commit: a8e93f4e60eabc432dde43449dfeb9a565c54da2

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip
