package:
  name: libplacebo
  version: 7.387.0
  epoch: 0
  description: "Reusable library for GPU-accelerated video/image rendering primitives"
  url: https://github.com/haasn/libplacebo
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - glad
      - vulkan-headers
      - vulkan-headers-dev
      - glslang-dev
      - libsdl2-dev
      - python-3.13
      - py3.13-jinja2
      - ffmpeg-9.0-dev

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/haasn/libplacebo/archive/refs/tags/v${{package.version}}.tar.gz
      expected-sha256: f9e62d3774a9c4cfd198ec3abaa88294aaade2e31c04d5ab02bcf4abc98b1df5

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: libplacebo-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libplacebo=${{package.full-version}}
    description: "Reusable library for GPU-accelerated video/image rendering primitives (dev files)"
