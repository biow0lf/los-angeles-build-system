package:
  name: alsa-utils
  version: 1.2.16
  epoch: 0
  description: "ALSA Utilities (like alsamixer etc)"
  url: https://www.alsa-project.org/wiki/Main_Page
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - alsa-lib-dev
      - ncurses-dev
      - systemd-dev
      - libudev-dev

pipeline:
  - uses: fetch
    with:
      uri: https://www.alsa-project.org/files/pub/utils/alsa-utils-1.2.16.tar.bz2
      expected-sha256: 092399d5e8749a1d5e188e393157521cec4b75693b60ebb79bbce728cff2232c

  - uses: autoconf/configure
    with:
      opts: |
        --sbindir=/usr/bin \
        --enable-nls \
        --disable-alsaconf \
        --disable-bat \
        --disable-xmlto \
        --with-curses=ncursesw

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip
