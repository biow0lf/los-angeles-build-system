package:
  name: modemmanager
  version: 1.24.2
  epoch: 0
  description: "Mobile broadband modem management service"
  url: https://modemmanager.org/
  copyright:
    - license: "GPL-2.0-or-later"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - python-3.13
      - glib-dev
      - dbus-dev
      - bash-completion
      - libgudev-dev
      - polkit-dev
      - libmbim-dev
      - libqmi-dev
      - gobject-introspection-dev
      - glib-gir

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/mobile-broadband/ModemManager/
      tag: ${{package.version}}
      expected-commit: f2b9ab1ad78d322f32134a444b5b54c6e8160e19

  - uses: meson/configure
    with:
      opts: |
        -Dsbindir=/usr/bin

  - uses: meson/compile

  - uses: meson/install

  - uses: strip
