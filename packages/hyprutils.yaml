package:
  name: hyprutils
  version: 0.14.2
  epoch: 0
  description: "Hyprland utilities library used across the ecosystem"
  url: https://github.com/hyprwm/hyprutils
  copyright:
    - license: "BSD-3"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - pixman-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hyprwm/hyprutils
      tag: v${{package.version}}
      expected-commit: a21e87b878e72ee5dfd375899e8b2ad0d0c4c0e1

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: hyprutils-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - hyprutils=${{package.full-version}}
    description: hyprutils dev
