package:
  name: which
  version: 2.25
  epoch: 0
  description: "Displays where a particular program in your path is located"
  copyright:
    - license: "GPL-3.0-only"

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://ftpmirror.gnu.org/which/which-2.25.tar.gz
      expected-sha256: 1cb83e4f702e60b8211ab5ec4c2afbab1b1dec80209456a7d2faf7584ed225ea

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip
