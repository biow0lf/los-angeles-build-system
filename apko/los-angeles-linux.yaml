# Los Angeles Linux -- root filesystem specification.
#
# apko assembles this list of apk packages into a single OCI image tarball
# (no `RUN` steps -- fully declarative/reproducible). scripts/extract-rootfs.sh
# turns that tarball into a plain directory tree (work/rootfs/), which is the
# target rootfs for the image assembly pipeline in image/.
#
# The kernel and initramfs are NOT listed here -- Wolfi ships neither (it is
# a container-only "undistro" with no bootable-kernel packages at all), so
# they're taken from Alpine (linux-lts + mkinitfs) directly in the builder
# image instead; see image/build-disk-image.sh.
#
# Track A (borrowed as-is from Wolfi, glibc-based, itself melange-built) vs.
# Track B (los-angeles-linux-*, built by us) are marked below. See the
# self-hosting roadmap in the top-level plan for moving packages from A to B.
#
# Every package that has real upstream source to build from has now moved
# to Track B (busybox, bash, coreutils, util-linux, e2fsprogs, dosfstools,
# systemd, udev, dbus, apk-tools, openssh, ca-certificates, glibc-2.44) --
# wolfi-baselayout is Track A's sole remaining entry, and stays there
# deliberately: it's Wolfi's own filesystem-skeleton/distro-identity
# package (owns things like /etc/os-release), not upstream software with
# a source tree to fork -- "self-hosting" it wouldn't mean anything.

contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local packages-out"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - keys/melange.rsa.pub
  packages:
    # Track A
    - wolfi-baselayout
    # Track B: built by us, not borrowed
    - los-angeles-linux-release@local
    - los-angeles-linux-base@local
    # busybox, bash, coreutils, util-linux, e2fsprogs, dosfstools, systemd,
    # dbus, apk-tools, openssh, ca-certificates, iproute2, iputils, and
    # glibc-2.44 are the self-hosted packages (see the plan's
    # self-hosting roadmap): built from actual source via
    # packages/busybox.yaml, packages/bash.yaml, packages/coreutils.yaml,
    # packages/util-linux.yaml, packages/e2fsprogs.yaml,
    # packages/dosfstools.yaml, packages/systemd.yaml, packages/dbus.yaml,
    # packages/apk-tools.yaml, packages/openssh.yaml,
    # packages/ca-certificates.yaml, packages/iproute2.yaml,
    # packages/iputils.yaml, and packages/glibc-2.44.yaml, not pulled
    # from Wolfi -- which also has same-named packages.
    #
    # busybox@local, bash@local, coreutils@local, util-linux@local,
    # e2fsprogs@local, dosfstools@local, systemd@local, dbus@local,
    # apk-tools@local, openssh@local, ca-certificates@local, iproute2@local,
    # and iputils@local: verified (in isolation, via `apko lock`) to
    # correctly force our own build for the *direct* want in each case.
    # util-linux, e2fsprogs, systemd, dbus, openssh, and ca-certificates
    # are a partial exception: the direct want resolves fine, but their
    # own subpackages (libblkid, libfdisk, libmount, libsmartcols,
    # libuuid, fstrim for util-linux; libcom_err, e2fsprogs-libs for
    # e2fsprogs; libsystemd, libsystemd-shared, systemd-boot,
    # systemd-systemctl for systemd; dbus-libs for dbus; openssh-client,
    # openssh-server, openssh-sftp-server, openssh-keygen,
    # openssh-server-config for openssh; ca-certificates-bundle for
    # ca-certificates) are pulled in transitively under their own names
    # and, unpinned, resolve to Wolfi's identically-versioned copies
    # instead -- same fix as glibc-2.44 below (apko/self-hosted.yaml),
    # just for a plain name-collision instead of a solver conflict.
    # dosfstools, apk-tools, iproute2, and iputils have no such
    # subpackage (only -doc, or none at all, never pulled transitively by
    # anything here). systemd's libsystemd-compression-libs is a
    # deliberate exception left unpinned -- see self-hosted.yaml's own
    # comment for why.
    #
    # gitlab.alpinelinux.org caused trouble twice while self-hosting these:
    # packages/apk-tools.yaml switches its git-checkout source to the
    # github.com/alpinelinux mirror (verified true mirror: same commit
    # once the tag is peeled) -- the host was down for an extended period
    # (500/502/403 errors) at the time. packages/ca-certificates.yaml (no
    # viable mirror -- that one's github.com/alpinelinux mirror is years
    # stale) hit a different, IP-reputation-based problem instead: the
    # host itself was fine, but returned HTTP 418 to *every* request --
    # git-checkout, and separately a plain wget via the `fetch` pipeline
    # -- specifically from GitHub Actions' runner IPs (reachable fine
    # elsewhere, including from wherever this comment is being read).
    # Not protocol-specific, so switching pipelines didn't help; instead
    # vendors the (227K) release tarball directly into
    # packages/ca-certificates/, checksum-verified at build time, which
    # sidesteps the network dependency for this one source entirely.
    #
    # udev@local: Wolfi splits systemd-udevd out of the `systemd` package
    # into `udev` (distinct from `eudev`, the non-systemd fork) --
    # without it there's no udevd running, so systemd never gets a
    # "device found" event for anything, including /dev/ttyS0, and every
    # device unit times out. It's a systemd *subpackage* too, but (unlike
    # the five above) resolves correctly when directly wanted @local --
    # verified in the same isolated `apko lock` check as systemd itself.
    #
    # packages/systemd.yaml passes -Dbpf-framework=false (see that file's
    # comment): the eBPF CO-RE objects it would otherwise build get
    # compiled against a vmlinux.h generated from the *host kernel's*
    # BTF data, which under Docker's --platform linux/amd64 on Apple
    # Silicon is genuinely arm64 underneath (QEMU only emulates
    # userspace) -- x86_64-targeted BPF against an arm64-shaped struct
    # pt_regs fails to compile. Disabling it trades away one hardening
    # feature (userns-restrict) for the ability to verify this build on
    # every dev machine, not just x86_64 CI.
    #
    # glibc-2.44 is deliberately NOT pinned here with @local. Pinning it
    # directly fixes the *direct* "glibc-2.44" want to our repo, but
    # apk-tools (and everything else) also needs so:libc.so.6 satisfied as
    # a *separate*, transitive constraint -- once the direct want is
    # pinned, the solver disqualifies every other glibc revision for that
    # edge (only one package may provide the shared "cmd:ldconfig") and
    # then fails outright, instead of reusing the pinned package to also
    # satisfy it. Bumping our epoch past Wolfi's, listing our repo first,
    # and bumping provider-priority were all tried too and made no
    # difference -- Wolfi's own live index isn't even a stable target to
    # race by version (observed its glibc-2.44 at both r0 and r6 within
    # one debugging session).
    #
    # Instead, `make build-rootfs` runs apko/generate-lockfile.sh first,
    # which locks apko/self-hosted.yaml (a minimal want-list containing
    # only glibc-2.44@local and glibc-2.44-iconv@local, where the @local
    # pin resolves cleanly since nothing else there creates a competing
    # so:-based edge) and splices those resolved entries over this
    # config's own lock. `apko build --lockfile=...` is then left no
    # other candidate for those names, so it installs ours -- verified:
    # `apko build --lockfile=...` installs glibc-2.44-2.44-r7 (ours, not
    # Wolfi's r6) end-to-end, and `make build-image && make test-boot`
    # still boots to multi-user.target.
    - busybox@local
    - bash@local
    - coreutils@local
    - util-linux@local
    - e2fsprogs@local
    - dosfstools@local
    - systemd@local
    - udev@local
    - dbus@local
    - apk-tools@local
    - openssh@local
    - ca-certificates@local
    - iproute2@local
    - iputils@local
    - glibc-2.44

  # Written to /etc/apk/repositories in the image so `apk add`/`apk upgrade`
  # work on a booted system (the mutable runtime model) -- not consulted at
  # apko build time. https://biow0lf.github.io/los-angeles-build-system is
  # build-packages.yml's `publish` job's real output (GitHub Pages, from
  # main, gated on boot-test passing -- see that workflow), not a
  # placeholder: verified live, serving a real APKINDEX.tar.gz per arch.
  # For local dev against packages that haven't been pushed yet, point a
  # booted image at `make serve-repo` instead (localhost:8080 from the
  # *host* -- see that Makefile target for how to reach it from a guest).
  # No runtime_keyring needed: apko installs contents.keyring above into
  # /etc/apk/keys of the built image automatically (that's how build-time
  # package verification is possible in the first place), so both keys are
  # already trusted at runtime -- a duplicate runtime_keyring entry with the
  # same filename collides with apko's own install of it.
  runtime_repositories:
    - https://packages.wolfi.dev/os
    - https://biow0lf.github.io/los-angeles-build-system

archs:
  - x86_64

cmd: /bin/sh -l
