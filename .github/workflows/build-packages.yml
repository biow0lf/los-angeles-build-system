name: Build packages

# Rebuilds every package on every change under packages/, rather than
# diffing for just the changed ones: melange has no build-time dependency
# graph across packages (see the plan's Risks section), so a diff-based
# trigger would miss stale build-time consumers of a changed package (e.g.
# a glibc bump). With only a couple of packages today, "rebuild everything"
# is simpler and strictly more correct; revisit with a real matrix once the
# package count/build time justifies the complexity.
on:
  push:
    branches: [main]
    paths: ["packages/**"]
  pull_request:
    paths: ["packages/**"]
  workflow_dispatch: {}

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write signing key
        run: |
          mkdir -p keys
          echo "${{ secrets.MELANGE_SIGNING_KEY_B64 }}" | base64 -d > keys/melange.rsa

      - name: Build all packages
        run: |
          set -eu
          for f in packages/*.yaml; do
            make build-package PKG="$(basename "$f" .yaml)"
          done

      - name: Rebuild signed index
        run: make build-index

      - uses: actions/upload-artifact@v4
        with:
          name: packages-out
          path: packages-out/
          retention-days: 14

  # Publishes the repo to GitHub Pages so `apk add`/`apk upgrade` on a
  # booted Los Angeles Linux system (the mutable runtime model) has
  # something real to point at -- only from main, never from a PR.
  #
  # One-time setup this workflow can't do for you: in the repo's Settings ->
  # Pages, set Source to "GitHub Actions".
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-out
          path: packages-out/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages-out
      - id: deployment
        uses: actions/deploy-pages@v4
