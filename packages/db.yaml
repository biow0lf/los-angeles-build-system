# Deviation from Wolfi's own recipe: the tag v5.3.37 no longer exists on
# berkeleydb/libdb upstream (they've since moved to a date-based tagging
# scheme, e.g. v2026.09.12) -- the commit itself is still reachable and
# is confirmed (via its own merge-commit message) to be exactly the
# 5.3.37 release. Tried naming that commit SHA directly as `tag:` on
# git-checkout first (raw `git fetch <sha>` works fine against GitHub),
# but melange's own git-checkout implementation needs an actual
# resolvable ref (branch/tag), not a bare SHA: "fatal: Remote branch
# <sha> not found in upstream origin". Switched to `fetch` against
# GitHub's own per-commit archive tarball URL instead, which sidesteps
# git-checkout's ref resolution entirely.
package:
  name: db
  version: "5.3.37"
  epoch: 0 # glibc: 2.43->2.44
  description: The Berkeley DB embedded database system
  copyright:
    - license: LicenseRef-berkeley-db
      license-path: LICENSE
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc-14-default
      - glibc-2.44-dev
  environment:
    CFLAGS: "-Wno-error=implicit-int -Wno-error=implicit-function-declaration"

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/berkeleydb/libdb/archive/c090b291f369ccb8359b78e0fd7d4b184db7317f.tar.gz
      expected-sha256: da382a21d8afb55f7731913c4efabd879a9e14d1893bcbbcf2eaa72b9f1d83b4

  - runs: |
      ./dist/configure \
        --host=${{host.triplet.gnu}} \
        --build=${{host.triplet.gnu}} \
        --target=${{host.triplet.gnu}} \
        --prefix=/usr \
        --libdir=/usr/lib \
        --mandir=/usr/share/man \
        --infodir=/usr/share/info \
        --localstatedir=/var \
        --enable-compat185 \
        --enable-shared \
        --enable-cxx \
        --disable-static

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      install -Dm644 LICENSE \
        ${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE

  - uses: strip

subpackages:
  - name: db-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - db
    description: db dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: db-utils
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr
          mv ${{targets.destdir}}/usr/bin ${{targets.subpkgdir}}/usr/
    description: Utils for The Berkeley DB embedded database system
    dependencies:
      runtime:
        - db
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: "db_dump db_printlog db_verify"
        - uses: test/tw/ver-check
          with:
            bins: db_dump
            version: ${{package.version}}

  - name: db-c++
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/libdb_cxx*.so ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check
    description: C++ binding for libdb

update:
  enabled: true
  github:
    identifier: berkeleydb/libdb
    strip-prefix: v
    tag-filter: v5.

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/no-docs
